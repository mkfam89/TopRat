[pytest]
testpaths = tests

# TopRat is a BUILT export of this tree, not source. Collecting it would
# import a second copy of every test module under the same name, which pytest
# rejects as a file mismatch and which aborts the whole run.
norecursedirs = TopRat .git __pycache__ .pytest_cache New Applied Skipped Backups

markers =
    needs_userdata: requires this user's own CONTENT — the bullet bank
        (resume_template/bullets.json) or the base resumes in resume_template/. There is
        no way to supply these from the repo: *.docx is gitignored and the bullets are
        the user's own words. Deselect on a fresh clone or in CI with:
        pytest -m "not needs_userdata"
        NOT for config DIALS. Tests that only need skills.json / skill_aliases.json /
        strategy.json / profile.json / geo_cache.json take the `frozen_config` fixture
        instead (tests/frozen_root.py) and run everywhere, so that editing your own
        config can never redden the suite. Reach for the marker only when real content
        is genuinely required.
