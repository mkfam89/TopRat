/* ---------------- table view ----------------
   The same list and the same row actions, in a denser presentation. Every cell comes from the
   /api/jobs record that the cards use. Nothing here needs a `jobpipe rebuild` to stay current. */
function renderTable(list){
  const tb = $('#tbody');
  // The open detail pane LIVES in this tbody, docked under its row. Move it to the body before
  // you delete the rows. If not, the re-render deletes the drawer while the user edits it.
  const d = $('#drawer');
  if(d && d.closest('#tbody')) document.body.appendChild(d);
  tb.innerHTML = '';
  syncHeaderSort();
  const frag = document.createDocumentFragment();
  for(const j of list){
    const pct = Math.round((j.skillMatch||0)*100);
    const lt = j.locationType||'';
    const tr = document.createElement('tr');
    // The queued tint is information on the board and noise in the queue, where every row has it.
    tr.className = (j.bookmarked?'is-book ':'') + ((j.queued && !QUEUE_MODE)?'is-queued ':'') + (j.ghostFlagged?'is-ghost ':'')
                 + (j.status==='applied'?'is-applied ':'') + (j.status==='skipped'?'is-skipped ':'')
                 + (j.blocked?'is-banned ':'') + (j.id===OPEN_ID?'is-open':'');
    tr.dataset.id = j.id;
    // An inline expander toggles. A second click on the open row closes it. The ▾ symbol promises
    // that behavior. The side pane of the card view has an × instead.
    tr.onclick = ()=> (j.id===OPEN_ID && d.classList.contains('open')) ? closeDetail() : openDetail(j.id);
    // Flags that live as chips on a card become a compact icon strip here.
    const flags = [
      // The wallpaper states of the card, faded, at the front of the strip. Same three icons, table scale.
      j.queued ? `<span class="t-state" title="In the tailoring queue">${HG_ICON}</span>` : '',
      j.ghostFlagged ? `<span class="t-state" title="You flagged this employer as a possible ghost job">👻</span>` : '',
      j.blocked ? '<span class="t-state" title="Employer banned">🚫</span>' : '',
      j.bookmarked ? '<span class="star" title="Bookmarked">★</span>' : '',
      // Hidden when you flagged it yourself. Your 👻 above already says it. Two ghosts in one
      // strip read as a count, not as two different claims.
      (j.ghost==='high' && !j.ghostFlagged) ? `<span class="ghost" title="${esc(ghostTip(j))}">👻</span>` : '',
      j.repost ? `<span class="recy" title="${esc(j.repostNote||'Seen before')}">♻</span>` : '',
      j.isLocal ? '<span title="Inside your commute radius">📍</span>' : '',
      (j.questionnaire||[]).length ? `<span title="${(j.answers||'').trim()?'Questionnaire answered':(j.questionnaire.length+' open question(s)')}">📋</span>` : '',
    ].filter(Boolean).join(' ');
    tr.innerHTML = `
      <td>
        <div class="t-co">${esc(j.company)||'—'}${nameTags(j)}</div>
        ${flags?`<div class="t-flags">${flags}</div>`:''}
        ${j.note?`<div class="t-note" title="Open this note" onclick="event.stopPropagation();openNote('${j.id}')">${NOTE_ON_ICON}<span class="txt">${esc(firstLine(j.note))}</span></div>`:''}
      </td>
      <td>
        <div class="t-role">${esc(j.role)||''}</div>
        ${j.employmentType?`<div class="t-meta" title="${esc(empTip(j))}">${esc(j.employmentType)}</div>`:''}
      </td>
      <td class="t-num">${j.foundDate?esc(dateOnly(j.foundDate)):'<span style="color:var(--faint)">—</span>'}</td>
      <td>
        <div${lt?` title="${esc(locTip(j))}"`:''}>${esc(j.location)||'—'}</div>
        ${lt?`<div class="t-meta">${esc(lt)}</div>`:''}
      </td>
      <td class="t-num ${j.salaryEstimated?'est-sal':''}"${j.salary?` title="${esc(j.salary)}"`:''}>${j.salary?esc(fmtPay(j.salary)):'<span style="color:var(--faint)">—</span>'}</td>
      <td>
        <span class="t-match" style="color:${matchColor(j.skillMatch||0)}">${pct}%</span>
        <div class="t-bar"><i style="width:${pct}%;background:${matchColor(j.skillMatch||0)}"></i></div>
      </td>
      <td class="t-num">${statusCell(j)}</td>
      <td class="t-num">${resumeCell(j)}</td>
      <td onclick="event.stopPropagation()">
        <div class="t-acts">
          ${QUEUE_MODE
            // In the queue the row action is the queue action. The posting link is not lost —
            // it is in the detail card that the row opens, one click away, next to the job
            // description it belongs with. Applying is a board decision, not a queue one.
            ? `<span class="unqsplit">
                 <button class="unq" title="Take this job out of the tailoring queue. Your tailoring notes are kept, so you can queue it again later." onclick="unqueueTailor('${j.id}')">✕ Un-queue</button>
                 ${CLAUDE_ENABLED?`<button class="unqmore" title="Queue options for this job" aria-haspopup="true" onclick="openTailorMenu(event,'${j.id}')">▾</button>`:''}
               </span>`
            : (j.applyUrl?`<a class="go" href="${esc(j.applyUrl)}" target="_blank" rel="noopener" onclick="markApplyClicked('${j.id}')">${statusOf(j)==='applied'?'View Posting':'Apply'} ↗</a>`:'')}
          <button class="ico${j.note?' on':''}" title="${j.note?'Open your note':'Add a quick note'}" onclick="openNote('${j.id}')">${j.note?NOTE_ON_ICON:NOTE_ICON}</button>
          <button class="ico star${j.bookmarked?' on':''}" title="${j.bookmarked?'Bookmarked — click to remove':'Bookmark this job'}" onclick="toggleBookmark('${j.id}')">${j.bookmarked?'★':'☆'}</button>
        </div>
      </td>`;
    frag.appendChild(tr);
  }
  tb.appendChild(frag);
  // Put the pane back under its row. A status change can remove the job from the filter. Then no
  // row remains under the pane. Close the pane instead of leaving an overlay with no row.
  if(OPEN_ID && d.classList.contains('open') && !dockDrawer(false)) closeDetail();
}

/* The Status column IS the control now. That is the table idiom for the Status button in the
   corner of a card. The cell already said which list the job is in. The button says the same
   thing, and it also changes the list. As a result, the status actions left the action cell.
   They used to be a set of ✓ Applied, 👎 Skip, ↩ Pending, and Unban that changed shape on each
   row. The read-only chip that sat here became the button. */
function statusCell(j){
  return `<div onclick="event.stopPropagation()">${statusBtn(j)}`
       + `${(statusOf(j)==='applied' && j.statusDate)?`<div class="t-meta">${esc(j.statusDate)}</div>`:''}</div>`;
}

// The table idiom of the SAME résumé status bubble that the mini card shows. See the card and
// table parity rule in CLAUDE.md. This used to be its own group of buttons: 📄 View, ✎ re-tailor,
// ✕ unqueue, and a bare Tailor button. View, the .docx download, and unqueue all still exist.
// They are inside the big card now, because resumeBubbleClick sends a click there when there is
// something to do.
function resumeCell(j){
  /* Card ↔ table parity for the suppressed "None" bubble (see resumeBubble). The card can simply
     drop the chip; a table CELL cannot go empty without the column looking broken, so the table
     idiom for "nothing here" is the same faint em-dash it already prints for a missing date or
     salary. Same information, each view's own convention. */
  if(!QUEUE_MODE) return resumeBubble(j) || '<span style="color:var(--faint)">—</span>';
  /* On /queue every row is queued BY DEFINITION, so a column of identical "Queued ▾" bubbles
     stated the filter, not the row, and it hid the one thing that does differ per row: whether a
     resume file exists yet, and which one. The cell names the file (click previews it, the same
     action as the path button in the detail card) or reads None. The queue options the bubble
     carried are not lost — they moved into the action cell's Un-queue split button. */
  // A queued job that FAILED gets the error tag in the cell that would have named its file.
  // On /queue this is the whole question the column exists to answer: it is still here, why?
  if(tailorErr(j) && !hasResume(j)) return errTag(j, 'Error');
  if(!hasResume(j))
    return '<span class="t-none" title="No resume file for this job yet. The job waits in the queue for that file.">None</span>';
  const name = (j.resumePath || j.resumePdf || j.resumeDocx || '').split('/').pop();
  // Trim the leading "<name>_Resume_" that every generated file shares. Without it the column
  // ellipsises every row to the same stub and names nothing.
  const shown = name.replace(/^.*?_Resume_/i, '') || name;
  return `<button class="t-resname" title="${esc(name)} — click to preview it"
                  onclick="event.stopPropagation();openResume('${j.id}')">📑 ${esc(shown)}</button>`;
}

// The column headers drive the SAME sort state as the dropdown. The two controls stay in step,
// and a change of view never loses the order.
function syncHeaderSort(){
  const cur = $('#fsort').value;
  document.querySelectorAll('table.jt thead th[data-sort]').forEach(th=>{
    const base = th.textContent.replace(/[▲▼]\s*$/,'').trim();
    th.innerHTML = esc(base) + (th.dataset.sort===cur ? `<span class="arrow">${SORTDIR==='asc'?'▲':'▼'}</span>` : '');
  });
}

function initHeaderSort(){
  document.querySelectorAll('table.jt thead th[data-sort]').forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.sort;
      if($('#fsort').value === key){ SORTDIR = SORTDIR==='asc' ? 'desc' : 'asc'; }
      else { $('#fsort').value = key; SORTDIR = (key==='company'||key==='title') ? 'asc' : 'desc'; }
      render();
    };
  });
}

// The found date and the applied date are calendar dates. Delete any time component as a
// precaution. This mirrors dateOnly() on the table board.
function dateOnly(s){ return String(s||'').trim().split(/[ T]/)[0]; }

function jobById(id){ return JOBS.find(j=>j.id===id); }

function openDetail(id){
  const j = jobById(id); if(!j) return;
  closeSalPop();
  if(OPEN_ID!==id){ OPEN_ID=id; markOpenCard(id); }
  const pct = Math.round((j.skillMatch||0)*100);
  const locs = (j.location||'').split(/\s+or\s+/i).map(s=>s.trim()).filter(Boolean);
  const missing = (j.missingSkills||[]);
  const resumeName = j.resumePath ? j.resumePath.split('/').pop() : '';
  const thrPct = Math.round(CUSTOMIZE_THR*100);
  const previewable = !!(j.resumePdf || j.resumeDocx || j.resumePath);
  let resume;
  // The résumé row answers "what file was built for this job?". When the answer is "none, and
  // here is why", the ERROR TAG is the answer and it sits exactly where the file name sits —
  // one tag, one click, the full explanation in the dialog (showTailorError). This replaced a
  // paragraph of prose that only ever covered ONE of the reasons a build fails (a missing
  // template) and that the mini card and table never showed at all.
  const terr = tailorErr(j);
  if(terr && !j.resumePath){
    resume = errTag(j, ERR_TITLE[terr.code] || 'Tailoring error');
  } else if(j.resumePath){
    // Show the PATH, because the path identifies the file on disk. Make the path the preview
    // trigger. A click lays the résumé over the job description and keeps you on the board.
    const openHref = '/' + encodeURI(j.resumePdf || j.resumeDocx || j.resumePath);
    resume = `<div>
        <button class="respath" onclick="openResume('${j.id}')"
                title="${j.resumePdf?'Show it over the job description':'No PDF twin. This opens the .docx file.'}">${esc(j.resumePath)}</button>
        <div class="desc-actions" style="margin-top:5px">
          <button class="minibtn" style="margin-left:0" onclick="openResume('${j.id}')">👁 Preview</button>
          <a class="minibtn" style="margin-left:0;text-decoration:none" href="${openHref}" target="_blank" rel="noopener">↗ New tab</a>
          ${j.resumeDocx?`<a class="minibtn" style="margin-left:0;text-decoration:none" href="/${encodeURI(j.resumeDocx)}" download>⬇ .docx</a>`:''}
          ${terr?errTag(j, ERR_TITLE[terr.code] || 'Tailoring error'):''}
        </div>
      </div>`;
  } else if((j.skillMatch||0) >= CUSTOMIZE_THR){
    if(j.templateExists){
      resume = `<span class="tpl-badge" title="This job uses a ready-made template, not an AI-tailored resume">TEMPLATE</span>`
        + `<span title="Your ${pct}% skill match is at or above the ${thrPct}% template threshold. This job therefore uses this ready-made template. It needs no AI tailoring.">${esc(j.templateName)}</span>`;
    } else {
      // No templateName means nothing was ever chosen — resume_template/ is empty or the data
      // folder does not resolve. Name the folder, not a file, or the reader goes looking for a
      // file that never existed.
      resume = `<span class="tpl-badge tpl-missing" title="resume_template/ holds no base resume file">NO TEMPLATE</span>`
        + (j.templateName
            ? `<span style="color:#b45309">This job needs <b>${esc(j.templateName)}</b>, but that file is not in <code>resume_template/</code>. Add the file. If you do not, this job gets an AI-tailored resume.</span>`
            : `<span style="color:#b45309"><code>resume_template/</code> holds no base resume, so there is nothing to copy for this job. Add one. If you do not, this job gets an AI-tailored resume.</span>`);
    }
  } else {
    resume = `<span style="color:#9ca3af">not tailored yet. It gets an AI-tailored resume.</span>`;
  }
  const d = $('#drawer');
  d.innerHTML = `
    <button class="dback" onclick="closeDetail()" title="View job cards (Esc)" aria-label="View job cards">
      <span class="dbchev">‹</span><span class="dbtxt">View Job Cards</span><span class="dbchev">‹</span>
    </button>
    <div class="dhead">
      <button class="dclose" onclick="closeDetail()" title="Close (Esc). Return to the cards." aria-label="Close detail">×</button>
      <div class="co">${queuedChip(j)}${j.ghost==='high'?`<span class="ghost" title="${esc(ghostTip(j))}">👻</span>`:''}${esc(j.company)||'—'}${dheadTags(j)}</div>
      <div class="role">${esc(j.role)||''}</div>
      <div class="chips" style="margin-top:10px">
        ${j.locationType?`<span class="chip loc ${j.locationType.toLowerCase()}" title="${esc(locTip(j))}">${j.locationType}</span>`:''}
        ${j.employmentType?`<span class="chip emp" title="${esc(empTip(j))}">${esc(j.employmentType)}</span>`:''}
        ${j.salary?`<span class="chip pay ${j.salaryEstimated?'est':''}" title="${esc(j.salary)} — ${esc(salaryTip(j))}">${esc(fmtPay(j.salary))}</span>`:''}
        <span class="chip match" style="${matchChip(j.skillMatch||0)}">${pct}% match</span>
        ${tailorChip(j)}
        ${j.status==='skipped'?`<span class="chip">skipped</span>`:''}
      </div>
      ${previewable?`<div class="dtoggle">
        <button id="tgl-jd" class="on" onclick="showJD()">📄 Job description</button>
        <button id="tgl-res" onclick="openResume('${j.id}')">📑 Résumé</button>
      </div>`:''}
    </div>
    <div class="dstage">
    <div class="dbody">
      ${(j.status!=='applied' && isApplyClicked(j.id)) ? `
      <div class="ask-banner">
        <span class="q">You opened this posting earlier — did you apply?</span>
        <button class="yes" onclick="answerApplied('${j.id}',true)">Yes</button>
        <button class="no" onclick="answerApplied('${j.id}',false)">No</button>
      </div>` : ''}
      ${j.repost&&j.repostNote?`<div class="repost-note"><span class="recy">♻</span> ${esc(j.repostNote)}</div>`:(j.repost?`<div class="repost-note"><span class="recy">♻</span> This is probably a repost of an earlier posting.</div>`:'')}
      <div class="row"><span class="k">Locations</span><span class="v">${locs.length?locs.map(esc).join(', '):'—'}</span></div>
      <div class="row"><span class="k">Found</span><span class="v">${esc(j.foundDate)||'—'}</span></div>
      ${j.status==='applied'?`<div class="row"><span class="k">Applied</span><span class="v" style="color:#047857;font-weight:600">✓ ${esc(j.statusDate)||'no date recorded'}</span></div>`:''}
      <div class="row"><span class="k">Salary</span><span class="v salcell">
        ${j.salary?`<span class="${j.salaryEstimated?'est-sal':''}" title="As recorded: ${esc(j.salary)}">${esc(fmtPay(j.salary))}</span>`:'<span style="color:#9ca3af">none found</span>'}
        <button class="salhint" id="salhint-${j.id}" onclick="toggleSalPop(event,'${j.id}')">i</button>
        <button class="sal-edit" title="Edit the salary, or override it" onclick="startSalEdit('${j.id}')">✎ edit</button>
      </span></div>
      <div id="saledit-${j.id}"></div>
      <div class="row"><span class="k">Source</span><span class="v">${esc(j.source)||'—'}</span></div>
      <div class="row"><span class="k">Resume</span><span class="v">${resume}</span></div>
      <div class="row"><span class="k">Skill match</span><span class="v">${pct}%

      <div class="sec-label">Missing / flagged skills</div>

          : `<div class="desc-empty">Not stored on this computer. Get it from the posting when you need it.</div>

             </div>`
      }</div>
    </div>
    <div class="respane" id="respane"></div>
    </div>
    <div class="dfoot">

                onclick="toggleGhostFlag('${j.id}')">${j.ghostFlagged?GHOST_OFF_ICON:GHOST_ICON}</button>
      </div>
      <div class="notebar ${NOTE_STATE}${j.note?' has':''}" id="notedock"

              ? `<button class="snbtn more" onclick="event.stopPropagation();setNoteState('open')" title="Expand the note">More</button>`
              : `<button class="snbtn min" onclick="event.stopPropagation();setNoteState('mini')" title="Collapse to one line">−</button>`}
            <button class="snbtn" onclick="event.stopPropagation();setNoteState('hidden')" title="Hide the note bar">×</button>
          </span>
        </div>
        <div class="snbody">
          <textarea class="note-area" id="note-${j.id}" placeholder="Private: recruiter name, referral, or follow-up date…">${esc(j.note)}</textarea>
          <div class="savednote" id="notesaved-${j.id}"></div>
        </div>
      </div>
      <button class="snpin" id="snpin" onclick="setNoteState('mini')" title="Show your note"><span class="pinico">${j.note?NOTE_ON_ICON:NOTE_ICON}</span> Show note</button>
    </div>
  `;
  const ta = d.querySelector('#note-'+cssid(j.id));
  if(ta) ta.addEventListener('blur', ()=>saveNote(j.id, ta.value));
  const qa = d.querySelector('#ans-'+cssid(j.id));
  if(qa) qa.addEventListener('blur', ()=>saveAnswers(j.id, qa.value));
  placeDrawer();
  document.body.classList.add('drawer-open');
  d.classList.add('open');
  // Keep the résumé/JD toggle where the user left it across a re-render (a save, a status flip).
  if(RES_OPEN && previewable) openResume(j.id); else { RES_OPEN=false; syncDToggle(); }
  if(!j.description) loadDesc(j.id);   // fetch the full description on open (cached after first)
}

/* ---------------- résumé preview overlay ----------------
   This lays the tailored résumé over the job description inside the same pane. The toggle in the
   header moves between the two. A comparison of "what they asked for" against "what I sent" then
   costs no tab and no scroll position. The PDF twin is the file that renders. A job with only a
   docx file (no LibreOffice at build time) gets a download instead of a broken viewer. */
let RES_OPEN = false;
function openResume(id){

               <a class="minibtn" style="margin-left:0;text-decoration:none" href="${href}" download>⬇ Download ${esc(name)||'resume'}</a></div>`);

}
function showJD(){ const p=$('#respane'); if(p) p.classList.remove('open'); RES_OPEN=false; syncDToggle(); }
function toggleResume(id){ RES_OPEN ? showJD() : openResume(id); }
function syncDToggle(){
  const a=$('#tgl-jd'), b=$('#tgl-res'); if(!a||!b) return;

/* ---------------- two different things, kept apart ----------------
   The yellow NOTE BAR above the action row is your private job note. It lives in tracking.csv,
   and only you read it. The TAILORING INSTRUCTIONS are for Claude. They live in to_process.json.
   They sit inside the JD pane under the missing skills, which is the gap they usually answer. They
   exist only when the Claude assistant is on. The word "note" for the second one is what made the
   two easy to confuse. */
// mini (a one-line strip that shows the note) → open (a bar with the textarea) → hidden (a small
// inline pin that brings it back). The app remembers the state across jobs and visits. A user who
// never writes notes therefore never gets an open box.
const NOTE_STATE_KEY = 'board_note_state';
let NOTE_STATE = (function(){
  try{ const v=localStorage.getItem(NOTE_STATE_KEY); return (v==='open'||v==='hidden')?v:'mini'; }
  catch(e){ return 'mini'; }
})();
function setNoteState(s){
  NOTE_STATE = s;
  try{ localStorage.setItem(NOTE_STATE_KEY, s); }catch(e){}
  const d=$('#notedock'); if(!d) return;
  d.classList.remove('mini','open','hidden'); d.classList.add(s);
  d.title = s==='open' ? '' : 'Your private note for this job. Click to edit it.';
  if(s==='open'){ const ta=d.querySelector('textarea'); if(ta) ta.focus(); }
}
// The collapsed bar shows the note itself, so a save must update the strip. A note save does not
// re-render the drawer. A re-render takes the focus away while the user types.
function syncNoteBar(val){
  const d=$('#notedock'); if(!d) return;
  d.classList.toggle('has', !!(val||'').trim());
  const p=$('#snpeek'); if(!p) return;
  p.textContent = (val||'').trim() || 'Add a private note: recruiter, referral, or follow-up date…';
  p.classList.toggle('empty', !(val||'').trim());
}
// kept as the toggle the note square itself uses: mini ↔ open
function toggleNoteDock(){ setNoteState(NOTE_STATE==='open' ? 'mini' : 'open'); }
// The one-line note strip on a card is a shortcut INTO the note footer of the detail card. Open
// the job, or leave it open if it is already open. Expand the note bar. Put the cursor in it. Set
// NOTE_STATE first. openDetail then renders the footer expanded instead of expanding it after.
function firstLine(s){ return (String(s||'').split(/\r?\n/).find(l=>l.trim()) || '').trim(); }
function openNote(id){
  NOTE_STATE = 'open';
  if(OPEN_ID!==id || !$('#drawer').classList.contains('open')) openDetail(id);
  setNoteState('open');                       // focuses the textarea + persists the state
  const nb = $('#notedock');
  if(nb && nb.scrollIntoView) nb.scrollIntoView({block:'nearest'});
}
// The job whose Tailor button you just pressed. The instructions box then appears for a job that
// was never queued. Without this, the box sits on every card.
let TAILOR_PROMPT = null;
function tailorInstructions(j){
  const txt = (j.tailorNotes||'');
  if(!CLAUDE_ENABLED) return '';   // no Claude Code on this machine => nothing would read them
  if(!j.queued && !txt.trim() && TAILOR_PROMPT!==j.id) return '';
  const state = j.queued ? 'queued for tailoring' : (txt.trim() ? 'saved, not queued' : 'not queued yet');
  // Without Claude Code the queue produces a template copy. Say so here, next to the box
  // where the user is about to write instructions that nothing would read. There is no
  // inline fix — the repair is `claude login` in a terminal — so this only informs.
  const keyNotice = AI_KEY.available ? '' : `
    <div class="tnkey">
      <span>⚠ Claude integration is not detected/enabled, so the queue will copy your template
        rather than act on these instructions. Your resume notes are still saved.
        <a href="/help/claude-code" target="_blank">How to set it up →</a></span>
    </div>`;
  return `
    <div class="sec-label">✎ Tailoring instructions — ${state}</div>
    ${keyNotice}
    <div class="tnbox">
      <textarea id="tn-${j.id}" placeholder="Optional. Tell Claude what to do with this one. For example: lead with the SRE and on-call work. They want Terraform and AWS, not Azure. Keep it to one page.">${esc(txt)}</textarea>
      <div class="qfoot">
        ${j.queued
          ? `<button class="minibtn" style="margin-left:0" onclick="saveTailorNotes('${j.id}')">💾 Save instructions</button>`
            + `<button class="minibtn" onclick="unqueueTailor('${j.id}')">✕ Un-queue</button>`
          : `<button class="minibtn" style="margin-left:0" onclick="saveTailorNotes('${j.id}',true)">⚡ Queue for tailoring</button>`
            + `<button class="minibtn" onclick="saveTailorNotes('${j.id}')">💾 Save for later</button>`}
        <button class="minibtn" onclick="clearTailorNotes('${j.id}')">🗑 Clear</button>
        <span class="qsaved" id="tnsaved-${j.id}"></span>
        <span class="tnhint">These are the instructions for the tailoring pass of Claude. They are not your private note. The sticky note holds that.</span>
      </div>
    </div>`;
}
// Show the instructions box and put the focus in it. Open the drawer first if the press came from
// a mini card or a table row. This replaced the modal notes prompt. One box, in one place, always.
function promptTailor(id, prefill){
  const j=jobById(id); if(!j) return;
  TAILOR_PROMPT = id;
  // Always re-render the drawer. On a job that was never queued, the box does not exist yet. This
  // is the one path that must end with the cursor inside the box.
  if(RES_OPEN) showJD();                       // the instructions live in the JD pane
  openDetail(id);
  const box=document.getElementById('tn-'+cssid(id));
  if(!box){ toast('Install Claude Code (Setup → AI resume tailoring) to add tailoring instructions.'); return; }
  // Seed order: the value from the caller → the saved value → the questionnaire answers.
  const seed=String(prefill!=null && prefill!=='' ? prefill : (j.tailorNotes || j.answers || '')).trim();
  if(seed && !box.value.trim()) box.value = seed;
  if(box.scrollIntoView) box.scrollIntoView({block:'center'});
  box.focus();
  if(box.setSelectionRange) try{ box.setSelectionRange(box.value.length, box.value.length); }catch(e){}
  // Flash the box. In a long description, the flash shows where you are.
  const wrap=box.parentElement;
  if(wrap && wrap.classList){ wrap.classList.add('flash'); setTimeout(()=>wrap.classList.remove('flash'), 900); }
}
async function saveTailorNotes(id, queue){
  const box = document.getElementById('tn-'+cssid(id));
  const txt = box ? box.value.trim() : '';
  const j = jobById(id);
  const payload = {notes:{[id]: txt}};
  if(queue) payload.ids = [id];
  try{
    const r = await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    const d = await r.json();
    if(j){ j.tailorNotes = txt; if(queue) j.queued = true; }
    const el = document.getElementById('tnsaved-'+cssid(id));
    if(el && !queue){ el.textContent='Saved ✓'; setTimeout(()=>el.textContent='',1500); }
    if(queue){
      toast('Queued for tailoring' + (typeof d.queued==='number' ? ' ('+d.queued+' in the queue)' : ''));
      render(); refreshDrawer(id);
    }
  }catch(e){ toast('The save failed.'); }
}
function clearTailorNotes(id){
  const box = document.getElementById('tn-'+cssid(id)); if(box) box.value='';
  saveTailorNotes(id).then(()=>{ const j=jobById(id); if(j && !j.queued) refreshDrawer(id); });
  toast('The customization notes are deleted.');
}
function cssid(id){ return id.replace(/[^a-zA-Z0-9_-]/g,'\\$&'); }
// Outline the card in the preview. This is a direct class toggle, not a re-render, so the list
// keeps its scroll position while the user clicks down the column.
function markOpenCard(id){
  document.querySelectorAll('.card.is-open,tr.is-open').forEach(c=>c.classList.remove('is-open'));
  if(!id) return;
  const sel = '[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]';
  // The card view outlines the card. The table view highlights the row. One open state, one function.
  const el = document.querySelector('.card'+sel) || document.querySelector('tr'+sel);
  if(el) el.classList.add('is-open');
}
// Put the drawer below the injected sticky nav. The header of the drawer is then never cut off.
function navHeight(){
  // Identify the injected bar by its CLASS, not by the brand text inside it: the brand is
  // wording (it has already changed once, to "Top Rat"), and a renamed app silently falling
  // back to 44px would misplace the drawer under a taller nav.
  const el = document.body.firstElementChild;
  if(el && el.classList && el.classList.contains('ui-nav') && el.offsetHeight) return el.offsetHeight;
  return 44;
}
// The sticky table thead and the docked drawer's dhead both key off the --nav-h CSS var, but
// that var was never actually set — every user was just the 52px fallback baked into the CSS.
// If the real injected nav renders taller than 52px (it wraps to two lines on a narrower window,
// or the badge/links change its height), thead's sticky offset falls short and the nav — z-index
// 99998, well above thead's 2 — paints over the gap, cropping into the header and the first row
// beneath it. Measuring the real nav and publishing it here keeps both sticky offsets honest.
function syncNavHeight(){
  document.documentElement.style.setProperty('--nav-h', navHeight() + 'px');
}
window.addEventListener('resize', syncNavHeight);

/* ---------------- where the drawer lives ----------------
   Card view: a fixed pane docked to the right of the card column (unchanged).
   Table view: an expander row INSIDE the table, directly under the row you clicked — the same
   #drawer element, moved into the row, so ids/handlers/résumé toggle keep working and there is
   no second copy of the detail markup to drift.
   DOCK_SEQ invalidates a pending close animation if the drawer is re-opened inside it. */
let DOCK_SEQ = 0;
function rowFor(id){
  if(!id) return null;
  const sel = 'tr[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]';
  return document.querySelector('#tbody '+sel);
}
// animate=false re-docks without a message. Every re-render uses it. There the pane was already
// open, and a slide looks like a flicker.
function dockDrawer(animate){
  const d = $('#drawer');
  const row = rowFor(OPEN_ID);
  if(!row){ undockDrawer(false); return false; }   // the open job fell out of the current filter
  DOCK_SEQ++;
  let ex = document.getElementById('rowexp');
  if(ex && ex.previousElementSibling !== row){ ex.remove(); ex = null; }
  if(!ex){
    ex = document.createElement('tr');
    ex.id = 'rowexp'; ex.className = 'rowexp';
    const td = document.createElement('td');
    td.colSpan = document.querySelectorAll('table.jt thead th').length || 9;
    const w = document.createElement('div');
    // An insert in the open state skips the transition. A style that never changed gives no
    // animation. That is what a quiet re-dock needs.
    w.className = 'expwrap' + (animate ? '' : ' open');
    td.appendChild(w); ex.appendChild(td);
    row.parentNode.insertBefore(ex, row.nextSibling);
    w.appendChild(d);
  } else {
    const w = ex.querySelector('.expwrap');
    if(d.parentElement !== w) w.appendChild(d);
    w.classList.add('open');
  }
  d.classList.add('inline'); d.style.top=''; d.style.height='';
  if(animate){
    const w = ex.querySelector('.expwrap');
    void w.offsetHeight;      // flush the collapsed state so the transition has a start value
    w.classList.add('open');  // (rAF is the usual trick here, but a background tab pauses rAF,
    revealRow(row, ex);       //  and then the pane never opens)
  }
  return true;
}
// Keep the row that you clicked on the screen, with as much of the pane as fits. Keep both clear
// of the sticky nav and the header. Do not move the page when the row is already in view.
function revealRow(row, ex){
  setTimeout(()=>{
    const th = document.querySelector('table.jt thead th');
    const top = navHeight() + (th ? th.offsetHeight : 34) + 8;
    const r = row.getBoundingClientRect();
    if(r.top >= top && ex.getBoundingClientRect().bottom <= window.innerHeight) return;
    const from = window.pageYOffset;
    const target = Math.max(0, from + r.top - top);
    if(Math.abs(target - from) < 4) return;
    try{ window.scrollTo({top:target, behavior:'smooth'}); }catch(e){}
    // In some browsers and settings, a smooth scroll does nothing. Reduced motion and embedded
    // views do this. Complete the scroll anyway. Do not leave the pane half off the screen.
    setTimeout(()=>{ if(Math.abs(window.pageYOffset - target) > 6) window.scrollTo(0, target); }, 380);
  }, 260);
}
function undockDrawer(animate){
  const d = $('#drawer');
  const ex = document.getElementById('rowexp');
  const seq = ++DOCK_SEQ;
  const finish = ()=>{
    if(seq !== DOCK_SEQ) return;                 // re-opened mid-animation — leave it docked
    if(d.parentElement !== document.body) document.body.appendChild(d);
    d.classList.remove('inline');
    const r = document.getElementById('rowexp'); if(r) r.remove();
  };
  const w = ex ? ex.querySelector('.expwrap') : null;
  if(w && animate){ w.classList.remove('open'); setTimeout(finish, 250); }
  else finish();
}
function placeDrawer(){
  const d = $('#drawer');
  if(VIEW === 'table'){
    // Slide when the pane arrives at a row that it does not already sit under. A re-render, a save,
    // and a refresh land on the same row. They must not animate again.
    const ex = document.getElementById('rowexp');
    const docked = d.classList.contains('inline') && ex && ex.previousElementSibling === rowFor(OPEN_ID);
    dockDrawer(!docked);
    return;
  }
  undockDrawer(false);
  const nh = navHeight();
  d.style.top = nh+'px'; d.style.height = 'calc(100% - '+nh+'px)';
}
function closeDetail(){ closeSalPop(); closeTailorMenu();
  undockDrawer(true); $('#drawer').classList.remove('open');
  document.body.classList.remove('drawer-open'); RES_OPEN=false; OPEN_ID=null; markOpenCard(null); }
window.addEventListener('resize', ()=>{ if($('#drawer').classList.contains('open')) placeDrawer(); });
// Escape closes one layer at a time: modal → tailor menu → résumé preview → drawer.
document.addEventListener('keydown', e=>{ if(e.key!=='Escape') return;
  if($('#confirmScrim').classList.contains('open')) closeConfirm();
  else if($('#btnmenu').classList.contains('open')) closeTailorMenu();
  else if(RES_OPEN) showJD();
  else closeDetail(); });

/* ---- persistence. Always send the FULL current row. If not, apply_marks resets the state. ---- */
async function saveRow(j){
  const row = { id:j.id, status:j.status, statusDate:j.statusDate||'',
                bookmarked: j.bookmarked?'yes':'no', notes: j.note||'',
                answers: j.answers||'' };
  try{
    await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({rows:[row]})});
    return true;
  }catch(e){ toast('Save failed'); return false; }
}

// Skip, applied, and ban all mean "my decision about this job is complete". A queued tailoring
// pass then has no purpose, so the job leaves the queue automatically. The instructions SURVIVE
// on purpose (dequeueSilently → /api/queue {remove:[…]}, the same as a manual unqueue). The status
// can change back, and the job can enter the queue again later.
async function dequeueSilently(ids){
  ids = ids.filter(id=>{ const j=jobById(id); return j && j.queued; });
  if(!ids.length) return;
  try{
    await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({remove:ids})});
    ids.forEach(id=>{ const j=jobById(id); if(j) j.queued=false; });
  }catch(e){ /* the status change is complete. One stray queue entry does not justify a failure. */ }
}
/* ---------------- auto-advance after a status change ----------------
   A skip, or a mark as applied, moves a job into a DIFFERENT status list. Under every filter
   except "All", the job that you were reading then leaves the open pane. If the pane closed there,
   the user must find the next card by hand after every decision. The preview therefore moves to
   the job that took its place. That is the same index, which is the next job down, or the last job
   when you were at the end. The review loop then continues: read → decide → next.
   This runs only when the pane was open ON THAT JOB. A skip pressed on a mini card or a table row
   never opens a pane that the user did not ask for. */
function listPos(id){ return currentList().findIndex(j=>j.id===id); }
// pos = the place of the job in the visible list BEFORE its status changed. Capture it first.
// currentList() filters on status, so after the change the job can already be absent.
function afterStatusChange(id, pos){
  const wasOpen = OPEN_ID===id && $('#drawer').classList.contains('open');
  render();
  const list = currentList();
  if(!wasOpen || list.some(j=>j.id===id)){ refreshDrawer(id); return; }
  if(!list.length){ closeDetail(); return; }          // nothing left in this list to move to
  const next = list[Math.min(Math.max(pos,0), list.length-1)];
  openDetail(next.id);
  revealCard(next.id);
}
// The card view must scroll the new card into the column itself. In the table view, revealRow
// inside dockDrawer already brings the row and its expander onto the screen.
function revealCard(id){
  if(VIEW==='table') return;
  const sel = '.card[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]';
  const el = document.querySelector(sel); if(!el || !el.scrollIntoView) return;
  try{ el.scrollIntoView({block:'nearest', behavior:'smooth'}); }catch(e){ el.scrollIntoView(); }
}

/* ---------------- status: ONE control, one entry point ----------------
   The board used to carry a separate button per transition — 👎 skip, ✓ mark applied, "Move to
   pending", "Un-skip", Ban, Unban — and several of them were the same move under two names: the
   Un-skip button on a skipped job and the Move-to-pending button on an applied job both just set
   the status to pending. Which buttons you saw depended on which status the job was already in,
   so the control moved around under the cursor as you worked down a list.
   Now there is one Status ▾ menu everywhere, listing the four lists a job can be in. Every
   transition goes through setStatus(), so the queue-cleanup, the ban/unban side effects and the
   auto-advance cannot drift apart button by button, as they had started to do.

   STATUSES are the board's four lists, in rank order (see the tint rank block in the CSS).
   'banned' is not a value of j.status — it's j.blocked, an employer-level fact — but from the
   user's point of view it is simply the list the job sits in, so the menu treats it as a fifth
   peer and setStatus() translates. Anything not in this table is treated as pending. */
const STATUSES = [
  {key:'banned',  label:'Banned',  hint:'Ban the employer. All their posts move here.'},
  {key:'pending', label:'Pending', hint:'You have not decided yet'},
  {key:'applied', label:'Applied', hint:'You sent an application'},
  {key:'skipped', label:'Skipped', hint:'You are not interested'},
];
// The list that a job is IN. The menu marks that list. A banned job reads as 'banned' whatever
// its underlying status, because Banned is the list that shows it. An unknown status and a missing
// status both become pending. A status that nobody can name must never render.
function statusOf(j){
  if(!j) return 'pending';
  if(j.blocked) return 'banned';
  return STATUSES.some(s=>s.key===j.status) && j.status!=='banned' ? j.status : 'pending';
}
function statusLabel(k){ const s=STATUSES.find(x=>x.key===k); return s?s.label:'Pending'; }

/* The single status transition. `to` is one of the STATUSES keys.
   Two side effects come with it. They are results of the move, not separate decisions. The user
   does not have to remember them:
   - Leaving the board's undecided state (→ applied/skipped/banned) means a queued tailoring pass
     no longer makes sense, so the job comes back out of the queue (instructions survive).
   - Moving a BANNED job anywhere else necessarily unbans its employer: the job cannot sit in
     Pending while its company is on the blocklist. That's a company-wide effect from a
     single-job action, so it is confirmed rather than done silently — see requestStatus(). */
async function setStatus(id, to){
  const j = jobById(id); if(!j) return;
  const from = statusOf(j);
  if(from === to) return;                       // already in that list — nothing to do
  const pos = listPos(id);
  const wasQueued = j.queued;

  if(to === 'banned'){ return doBan(id); }      // ban has its own reason prompt + company-wide path

  // The job leaves Banned. Unban the employer first. Then continue and set the real status. The
  // caller (requestStatus) already confirmed the unban.
  if(from === 'banned'){
    await unbanEmployer(j, true);               // quiet: the status toast below covers it
    // The unban covers the whole employer, so it covers every job of theirs on the board. If it
    // cleared only THIS job, the other jobs stay painted as banned until the next reload.
    const co = normCo(j.company);
    JOBS.forEach(x=>{ if(normCo(x.company)===co) x.blocked = false; });
  }

  j.status = to;
  j.statusDate = (to === 'applied') ? today() : '';
  const dq = (to === 'pending') ? Promise.resolve() : dequeueSilently([id]);
  toast('Moved to ' + statusLabel(to)
        + (from === 'banned' ? ' · unbanned ' + j.company : '')
        + (wasQueued && to !== 'pending' ? ' · removed from the tailoring queue' : ''));
  return Promise.all([saveRow(j), dq]).then(()=>afterStatusChange(id, pos));
}

/* What the menu actually calls. Everything is a straight setStatus() except leaving Banned, which
   quietly unbans a whole EMPLOYER as a side effect of moving ONE job — a bigger consequence than
   the click implies, and one that silently returns every other posting from that company to the
   board. So it asks first, naming both halves of what's about to happen. */
function requestStatus(id, to){
  const j = jobById(id); if(!j) return;
  const from = statusOf(j);
  if(from === to) return;
  if(from === 'banned' && to !== 'banned'){
    const others = JOBS.filter(x=>x.id!==id && x.blocked && normCo(x.company)===normCo(j.company)).length;
    openConfirm({
      title:'Move to ' + statusLabel(to) + ' and unban ' + j.company + '?',
      message:'A job cannot stay in ' + statusLabel(to) + ' while its employer is banned. This move '
              + 'therefore unbans ' + j.company + ' as well'
              + (others ? '. Their other ' + others + ' post' + (others>1?'s':'') + ' also return to your normal lists.' : '.'),
      confirmLabel:'Move and unban', danger:false, showReason:false,
      onConfirm:()=>setStatus(id, to)
    });
    return;
  }
  setStatus(id, to);
}
// A bookmark removal inside the Bookmarked filter is the same kind of move. The job leaves the
// list. The ★ flips IMMEDIATELY. It is a fast control on the card, and a wait for the write to
// return made the click look like a miss. The save still drives afterStatusChange.
function toggleBookmark(id){ const j=jobById(id); const pos=listPos(id); j.bookmarked=!j.bookmarked;
  render();
  saveRow(j).then(()=>afterStatusChange(id, pos));
  toast(j.bookmarked?'Bookmarked':'Bookmark removed'); }
function saveNote(id,val){ const j=jobById(id); const changed=(j.note||'')!==val; j.note=val; syncNoteBar(val);
  saveRow(j).then(ok=>{
  const el=$('#notesaved-'+cssid(id)); if(el&&ok){el.textContent='Saved ✓'; setTimeout(()=>el.textContent='',1500);}
  if(changed) render();   // mini card's note icon + preview line only live in the grid render —
}); }                      // without this they were stuck until a filter switch or refresh re-rendered it
// The questionnaire answers persist through the SAME /api/save row shape as the notes. The tracker
// always had an `answers` store and a tracking.csv column. Only the card board did not use it.
function saveAnswers(id,val){ const j=jobById(id); if(!j) return;
  const changed = (j.answers||'') !== val;
  j.answers=val;
  saveRow(j).then(ok=>{
    const el=$('#anssaved-'+cssid(id)); if(el&&ok){el.textContent='Saved ✓'; setTimeout(()=>el.textContent='',1500);}
    if(changed) render();   // chip flips to "answered"
  });

// Send the answers directly into the Tailor dialog, already filled in. An answer to a gap question
// is exactly the instruction that the next tailoring pass needs.
function answersToTailor(id){
  const j=jobById(id); if(!j) return;
  const box=document.getElementById('ans-'+cssid(id));
  const val=(box?box.value:(j.answers||'')).trim();
  if(!val){ toast('Answer at least one question first.'); if(box) box.focus(); return; }
  if((j.answers||'')!==val) saveAnswers(id, val);
  if(!CLAUDE_ENABLED){
    // Claude is not configured. Nothing reads the notes. Say so. Do not write them without a
    // message into a file that nothing consumes.
    toast('Install Claude Code (Setup → AI resume tailoring) to send notes with a tailoring request.');
    return;
  }
  promptTailor(id, val);   // seeds the tailoring-instructions box just above
}

function doApply(id){ const j=jobById(id);

// stop the question.
function answerApplied(id, yes){

  const j=jobById(id);

// Tailor resume. With the Claude assistant on, the press opens the job and puts the cursor in the
// TAILORING INSTRUCTIONS box inside the JD pane. There is no modal. One box, always in the same
// place, beside the missing skills that it usually answers. With the assistant off, nothing reads
// the instructions, so the job enters the queue immediately. The deterministic template path is
// the same in both cases.
function doTailor(id, prefill){
  const j=jobById(id); if(!j) return;
  if(!CLAUDE_ENABLED){ queueTailor(id, ''); return; }
  promptTailor(id, prefill);   // promptTailor seeds from saved instructions / answers itself
}
async function queueTailor(id, notes){
  const payload = {ids:[id]};
  const txt = (notes||'').trim();
  if(txt) payload.notes = {[id]: txt};
  try{
    const r=await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    const d=await r.json();
    const j=jobById(id); if(j){ j.queued = true; if(txt) j.tailorNotes = txt; }
    render(); refreshDrawer(id);
    toast('Queued for tailoring ('+ (d.queued||1) +' in the queue)' + (txt?' · notes saved':''));
  }catch(e){ toast('The job did not enter the queue.'); }
}

/* ---------------- tailoring state machine ----------------
   One split button covers all three states. It replaces a queue-only action with no undo. Nothing queued yet → queue it. Already queued → edit the notes, or REMOVE it from the
   queue. A résumé already built → tailor it again. Only the queued state has a ▾ menu. In every
   other state the instructions box owns the queue button, so there is nothing to choose. */
function tailorState(j){ return j.queued ? 'queued' : (hasResume(j) ? 'done' : 'new'); }
function tailorSplit(j){
  const st = tailorState(j);
  // Not queued, with or without an existing résumé: one plain button that opens the instructions
  // box. The queue action happens there, so a menu has nothing to offer.
  if(st!=='queued')
    return `<button class="btn" title="${hasResume(j)?'Tailor this resume again':'Queue this job for a tailored resume'}"
                    onclick="tailorPrimary(event,'${j.id}')">✎ Tailor resume</button>`;
  // Queued: the two remaining actions are choices, so the button opens the menu and closes it.
  return `<div class="btnsplit">
      <button class="btn on" title="In the tailoring queue. Click to see what you can do with it."
              onclick="tailorPrimary(event,'${j.id}')">${HG_ICON}Queued</button>
      <button class="btn caret on" title="Tailoring options" onclick="openTailorMenu(event,'${j.id}')">▾</button>
    </div>`;
}
// The primary click. A QUEUED job opens the menu instead of acting. Once the job is in the queue,
// the two useful moves are choices: edit the instructions, or take the job out. Show both instead
// of a guess at one. A second press closes the menu.
function tailorPrimary(ev, id){
  const j=jobById(id); if(!j) return;
  // A press on a QUEUED button toggles its menu. A second press closes it.
  if(tailorState(j)==='queued'){
    if($('#btnmenu').classList.contains('open') && MENU_ID===id){ closeTailorMenu(); return; }
    openTailorMenu(ev, id); return;
  }
  doTailor(id);
}
let MENU_ID = null;
function openTailorMenu(ev, id){
  if(ev && ev.stopPropagation) ev.stopPropagation();
  const j=jobById(id); if(!j) return;
  if($('#btnmenu').classList.contains('open') && MENU_ID===id){ closeTailorMenu(); return; }
  const m=$('#btnmenu');
  const items=[];
  // CAUTION: Never put note text into these onclick attributes. A note that contains a quote
  // breaks the handler. The handlers take the id only. promptTailor() reads the saved
  // instructions itself.
  // Only a queued job has a menu. Every other action is a button inside the tailoring-instructions
  // box: queue the job, or queue it again with new instructions. In that box, the text that you
  // queue is in front of you.
  if(CLAUDE_ENABLED)
    items.push(`<button onclick="closeTailorMenu();doTailor('${id}')">✎ Edit instructions<span class="mhint">This opens the box under the missing skills</span></button>`);
  // "What else is in the queue with it?" — the third thing you want once a job is queued, and the
  // only one that is not about THIS job. Same destination as the Queued chip and bubble: the
  // Tailoring queue page, where the queue can also be run on the spot. Omitted when you are
  // already standing on it: a menu row that reloads the page you are on is not an option.
  if(!QUEUE_MODE)
    items.push(`<button onclick="closeTailorMenu();openQueueView()">${HG_ICON}Go to the tailoring queue<span class="mhint">Every job waiting for a resume, in one list</span></button>`);
  items.push(`<button class="danger" onclick="closeTailorMenu();unqueueTailor('${id}')">✕ Un-queue<span class="mhint">The app keeps the instructions, so you can queue the job again later</span></button>`);
  if(!CLAUDE_ENABLED)
    items.push(`<button disabled style="cursor:default;color:var(--muted)">Instructions need Claude Code<span class="mhint">Install it in Setup → AI resume tailoring; nothing here reads instructions without it</span></button>`);
  m.innerHTML = items.join('');
  MENU_ID = id;
  m.classList.add('open');
  const r=(ev&&ev.currentTarget)?ev.currentTarget.getBoundingClientRect():{left:20,top:80,bottom:100};
  const w=m.offsetWidth||250, h=m.offsetHeight||90;
  m.style.left = Math.max(8, Math.min(r.right-w, window.innerWidth-w-10)) + 'px';
  let top = r.top-h-6; if(top<8) top = Math.min(r.bottom+6, window.innerHeight-h-8);
  m.style.top = top+'px';
}
function closeTailorMenu(){ $('#btnmenu').classList.remove('open'); MENU_ID=null; }
// Every element that OPENS this menu is excluded, so its own press can never be read as the
// outside click that closes it. `.resbtn` and the header's `.chip.queued` joined the list when
// they became menu buttons.
document.addEventListener('click', e=>{ if(!e.target.closest('#btnmenu') && !e.target.closest('.btnsplit')
    && !e.target.closest('.statusbtn') && !e.target.closest('.resbtn') && !e.target.closest('.chip.queued')
    && !e.target.closest('.unqsplit')) closeTailorMenu(); });

/* ---------------- the Status ▾ control ----------------
   One button per job, in all three places a job is drawn (mini card, table row, detail card), so
   the same control does the same thing wherever you are and nothing moves around as a job changes
   list. The button WEARS the current status (that's the at-a-glance half — it replaces the old
   read-only status chip as well as the buttons) and opens a menu of the other three to move to.
   Rendered from STATUSES, so adding a list later means adding one row to that table. */
function statusBtn(j, cls){
  const cur = statusOf(j);
  return `<button class="statusbtn st-${cur}${cls?' '+cls:''}" title="Status: ${statusLabel(cur)}. Click to move this job to another list."
                  onclick="openStatusMenu(event,'${j.id}')">${statusLabel(cur)}<span class="caret">▾</span></button>`;
}
function openStatusMenu(ev, id){
  if(ev && ev.stopPropagation) ev.stopPropagation();
  const j = jobById(id); if(!j) return;
  // A second press on the same button closes it, the same as the tailor menu.
  if($('#btnmenu').classList.contains('open') && MENU_ID==='status:'+id){ closeTailorMenu(); return; }
  const cur = statusOf(j);
  const m = $('#btnmenu');
  m.innerHTML = STATUSES.map(s=>{
    if(s.key === cur)
      return `<button class="cur" disabled><span class="dot st-${s.key}"></span>${s.label} <span class="curtag">· current</span>`
           + `<span class="mhint">${esc(s.hint)}</span></button>`;
    // A move out of Banned unbans the whole employer. A move TO Banned bans it. Both cover the
    // whole company, so the menu says so before the click, not only in the dialog after it.
    const extra = s.key==='banned' ? '. This bans the employer.'
                : (cur==='banned' ? ' — unbans ' + j.company : '');
    return `<button class="${s.key==='banned'?'danger':''}" onclick="closeTailorMenu();requestStatus('${id}','${s.key}')">`
         + `<span class="dot st-${s.key}"></span>${s.label}<span class="mhint">${esc(s.hint + extra)}</span></button>`;
  }).join('');
  MENU_ID = 'status:'+id;
  m.classList.add('open');
  placeMenu(m, ev);
}
// Shared placement. Move above the button when there is no room below. Never go off an edge.
function placeMenu(m, ev){
  const r = (ev&&ev.currentTarget) ? ev.currentTarget.getBoundingClientRect() : {left:20,right:200,top:80,bottom:100};
  const w = m.offsetWidth||250, h = m.offsetHeight||90;
  m.style.left = Math.max(8, Math.min(r.right-w, window.innerWidth-w-10)) + 'px';
  let top = r.bottom+6; if(top+h > window.innerHeight-8) top = Math.max(8, r.top-h-6);
  m.style.top = top+'px';
}
// Unqueue. The customization notes SURVIVE on purpose, on the server. You can then return to the
// job, edit the instructions, and queue it again. You type nothing a second time.
async function unqueueTailor(id){
  try{
    const r=await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({remove:[id]})});
    const d=await r.json();
    const j=jobById(id); if(j) j.queued=false;
    // In queue mode the row is about to disappear from the list, so an open detail pane under it
    // has nothing left to sit on. Close it rather than leave a pane with no row.
    if(QUEUE_MODE && OPEN_ID===id) closeDetail();
    render(); refreshDrawer(id);
    toast('Un-queued' + (typeof d.queued==='number' ? ' — '+d.queued+' left in the queue' : ''));
  }catch(e){ toast('The job did not leave the queue.'); }
}

/* ---------------- queue mode: no run bar ----------------
   /queue used to open with a ▶ Run tailoring now button, a live status line, a poll of
   /api/sched-status, and a paragraph on what a run would produce on this machine. All of it is
   gone (2026-08). Building resumes is the scheduled hourly pass; a manual trigger at the top of
   the page was a second way to start the same `tailor_local` job, racing the scheduled one, and
   it pushed the actual worklist below the fold. The queue page reads and prunes the queue now.
   POST /api/queue-run still exists in dashboard_server.py and still works — nothing in this page
   calls it. Restore a caller here if the manual run is ever wanted back. */

/* ---------------- ghost flag → ban offer ----------------
   One flagged posting is a bad posting. A SECOND posting from the same employer is a pattern, and
   the blocklist is the deterministic answer to a pattern. The board therefore offers a ban on the
   second flag. It does not offer one on the first, because that is too fast. It also never bans on
   its own, because the ban is the decision of the user. The server remembers an explicit "No, keep
   them" in ghost_flags.json banPrompt. It then never asks about that employer again, whatever the
   number of new flags. Escape and a click outside are NOT a no. They stop the question this
   time only. */
async function toggleGhostFlag(id){
  const j=jobById(id); if(!j) return;
  const want = !j.ghostFlagged;
  try{
    const r=await fetch('/api/ghost-flag',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:id, company:j.company, role:j.role, flagged:want})});
    const d=await r.json();
    if(!d || !d.ok){ toast((d&&d.error)||'The flag did not save.'); return; }
    j.ghostFlagged = want;
    // The COUNT is for each employer, so every card of theirs on the board moves with it.
    const co = normCo(j.company);
    JOBS.forEach(x=>{ if(normCo(x.company)===co) x.ghostFlagCount = d.count; });
    render(); refreshDrawer(id);
    toast(want ? ('Flagged as a possible ghost job' + (d.count>1 ? ' · '+d.count+' from '+j.company : ''))
               : 'Ghost flag removed');
    if(want && d.count>=2 && !d.declined && !j.blocked) offerBanAfterFlags(j, d.count);
  }catch(e){ toast('The flag did not save.'); }
}
function offerBanAfterFlags(j, n){
  openConfirm({
    title:'Ban '+j.company+'?',
    message:'You flagged '+n+' of their postings as possible ghost jobs. A ban moves their posts to '
          + 'your Banned list and keeps them off the board. You can unban the employer at any time.',
    confirmLabel:'Ban employer', cancelLabel:'No, keep them', danger:true, showReason:true,
    reasonValue:'Flagged '+n+' postings as ghost jobs',
    reasonPlaceholder:'Reason (optional)',
    onConfirm:(reason)=>banEmployer(j, reason, 'ghost'),
    onCancel:()=>declineGhostBan(j.company)
  });
}
async function declineGhostBan(company){
  try{
    await fetch('/api/ghost-flag',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company:company, decline:true})});
    const co=normCo(company);
    JOBS.forEach(x=>{ if(normCo(x.company)===co) x.ghostBanDeclined = true; });
    toast('Kept. This dialog does not ask about '+company+' again.');
  }catch(e){ /* a declined prompt is a preference. It does not need an error toast. */ }
}

function doBan(id){ const j=jobById(id);
  openConfirm({
    title:'Ban '+j.company+'?',
    message:'Their job posts move to your Banned list. They stop showing in your other lists. You can unban the employer at any time.',
    confirmLabel:'Ban employer', danger:true, showReason:true,
    reasonPlaceholder:'Reason (optional). For example: ghost jobs, spam reposts, or a bad experience…',
    onConfirm:(reason)=>banEmployer(j, reason)
  });
}
// A ban does NOT delete the job from the board. A ban is a fast decision, and people reverse it
// seconds later. The card therefore stays in place, struck through with a red diagonal, until the
// next reload. Unban is on the card. JUST_BANNED holds the employers banned in this session. They
// are the only blocked jobs that the normal filters still pass.
const JUST_BANNED = new Set();
const normCo = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
// The default tactic is 'other'. A ban from the ghost-flag prompt records 'ghost'. The blocklist
// entry then says WHY, and the user types nothing.
async function banEmployer(j, reason, tactic){
  try{
    // A ban covers the whole company. Every OTHER queued job from the same employer therefore
    // leaves the queue as well, not only the job whose Ban button you pressed.
    const co = normCo(j.company);
    const queuedIds = JOBS.filter(x=>x.queued && normCo(x.company)===co).map(x=>x.id);
    await fetch('/api/block-employer',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company:j.company, reason:(reason||'').trim(), tactic:(tactic||'other')})});
    await dequeueSilently(queuedIds);
    JUST_BANNED.add(co);
    await load();                       // picks up `blocked` for every job of that employer
    render(); refreshDrawer(j.id);
    toast('Banned '+j.company + (queuedIds.length?' · removed from the tailoring queue':'')
          + '. It stays listed until you reload, in case you change your mind.'); }
  catch(e){ toast('The ban failed.'); }
}
/* Unban. `quiet` stops the toast and the re-render. Use it when this call is the first half of a
   status move (setStatus). There the one toast, "Moved to Pending · unbanned X", tells the whole
   story. A re-render in the middle of the move flashes the job through an intermediate state. */
async function unbanEmployer(j, quiet){
  try{ await fetch('/api/unblock-employer',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company:j.company})});
    JUST_BANNED.delete(normCo(j.company));
    if(quiet){ return; }
    toast('Unbanned '+j.company); await load(); refreshDrawer(j.id); }
  catch(e){ if(!quiet) toast('The unban failed.'); }
}
let salPopId=null;
async function loadDesc(id){
  const box=document.getElementById('desc-'+id); if(!box) return;
  const j=jobById(id);
  box.innerHTML = `<div class="desc-empty">The description is loading…</div>`;
  const link=(u)=> u?`<a href="${esc(u)}" target="_blank" rel="noopener">View original posting ↗</a>`:'';
  try{
    const r=await fetch('/api/jobdesc?id='+encodeURIComponent(id));
    const d=await r.json();
    if(d.ok && d.text){
      if(j) j.description = d.text;   // remember for this session so re-opening is instant
      // d.message alongside ok=true is advisory (e.g. the posting is expired but its text
      // is still on the page) — a bar above the description, not a replacement for it.
      box.innerHTML = (d.message?`<div class="desc-notice">${esc(d.message)}</div>`:'')
        + `<div class="desc-body">${esc(d.text)}</div>`
        + `<div class="desc-src">Read live from the posting${d.source?` · ${esc(d.source)}`:''}${d.cached?' · cached':''}. `
        + `${link(d.url||(j&&j.applyUrl))}</div>`;
    } else {
      // The fetch can succeed and still carry no posting: a sign-in wall, a taken-down job,
      // a JavaScript shell, or a redirect blob. jobdesc.assess() names which, and we say so
      // in plain words — showing that page's metadata instead would read as the job.
      const why = d.message || 'The description did not load. The site probably needs a real browser to render it.';
      const detail = (!d.message && d.error) ? `<br><span style="font-size:11px">(${esc(d.error)})</span>` : '';
      box.innerHTML = `<div class="desc-empty">${esc(why)}${detail}</div>`
        + `<div class="desc-actions">${link(d.url||(j&&j.applyUrl))}`
        + `<button class="minibtn" onclick="loadDesc('${id}')">↻ Try again</button></div>`;
    }
  }catch(e){
    box.innerHTML = `<div class="desc-empty">The description did not load.</div>`
      + `<div class="desc-actions">${link(j&&j.applyUrl)}<button class="minibtn" onclick="loadDesc('${id}')">↻ Try again</button></div>`;
  }
}

// Close the bubble on an outside click, a scroll (the bubble is fixed and does not follow), a

// ---- manual salary override (big-card Salary row) ----
function startSalEdit(id){

  closeSalPop();

      <button class="minibtn" onclick="saveSalEdit('${id}')">Save</button>
      <button class="minibtn" onclick="cancelSalEdit('${id}')">Cancel</button>
      <span class="sal-hint">Type any pay text. Leave blank + Save to clear the override and return to the auto figure.</span>
    </div>`;
  const inp=document.getElementById('salinput-'+cssid(id)); if(inp){ inp.focus(); inp.select(); }
}
function cancelSalEdit(id){ const box=document.getElementById('saledit-'+cssid(id)); if(box) box.innerHTML=''; }
async function saveSalEdit(id){
  const inp=document.getElementById('salinput-'+cssid(id));
  const val=inp?inp.value.trim():'';
  try{
    const r=await fetch('/api/salary-edit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, value:val})});
    const d=await r.json();
    if(!d.ok){ toast(d.error||'The save failed.'); return; }
    toast(d.msg || 'Salary saved');
    await load(); openDetail(id);   // refresh board (badge + chip) and re-open the drawer
  }catch(e){ toast('The save failed.'); }
}

// Re-render the detail pane only when it shows THIS job. It used to look for the id of the
// bookmark button. That button is on the card now, so the test is the open id itself.
function refreshDrawer(id){ if(OPEN_ID===id && $('#drawer').classList.contains('open')) openDetail(id); }
function today(){ return new Date().toISOString().slice(0,10); }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// ---- confirm modal (ban/unban) ----
let _confirmCb=null, _confirmNo=null;
function openConfirm(opts){
  $('#confirmTitle').textContent = opts.title || 'Are you sure?';
  $('#confirmMsg').textContent = opts.message || '';
  const ta=$('#confirmReason');
  ta.style.display = opts.showReason ? 'block' : 'none';
  ta.value = opts.reasonValue || ''; if(opts.reasonPlaceholder) ta.placeholder = opts.reasonPlaceholder;
  const ok=$('#confirmOk');
  ok.textContent = opts.confirmLabel || 'Confirm';
  ok.className = 'btn' + (opts.danger ? ' danger' : '');
  // infoOnly = there is nothing to decide, so there is nothing to cancel. One button, which
  // dismisses. A "Cancel" beside an explanation asks a question the dialog never posed.
  $('#confirmCancel').style.display = opts.infoOnly ? 'none' : '';
  $('#confirmCancel').textContent = opts.cancelLabel || 'Cancel';
  $('#confirmMsg').style.whiteSpace = 'pre-line';   // the message is written in paragraphs
  _confirmCb = opts.onConfirm || null;
  _confirmNo = opts.onCancel || null;   // only the Cancel BUTTON is a decision — see closeConfirm
  $('#confirmScrim').classList.add('open');
  if(opts.showReason) setTimeout(()=>ta.focus(), 50);
}
// answered=true means that the user pressed the cancel button, that is, said no on purpose.
// Escape and a click on the scrim close the dialog. They are not answers, so they must NOT call
// onCancel. If they did, one stray Escape means "never ask me about this employer again".
function closeConfirm(answered){
  $('#confirmScrim').classList.remove('open');
  const no=_confirmNo; _confirmCb=null; _confirmNo=null;
  if(answered && no) no();
}
$('#confirmCancel').onclick = ()=>closeConfirm(true);
$('#confirmOk').onclick = ()=>{ const cb=_confirmCb, reason=$('#confirmReason').value.trim(); closeConfirm(); if(cb) cb(reason); };
$('#confirmScrim').addEventListener('click', e=>{ if(e.target===$('#confirmScrim')) closeConfirm(); });

// setView() rewrites the URL, so back and forward between / and /table must land on the
// matching view.
window.addEventListener('popstate', ()=>{
  if(QUEUE_MODE) return;   // /queue has one view; never let a history pop flip it to cards
  const want = (location.pathname === '/table' || location.pathname === '/job_tracker.html') ? 'table' : 'cards';
  if(want !== VIEW){ VIEW = want; applyView(); render(); }
});

/* ---------------- back to top ----------------
   The window is the scroller in BOTH views. The table scrolls sideways only, inside .tscroll.
   One button at page level therefore serves the cards and the table. There is no parity gap to
   adapt. The button appears after about one screen of scroll. At that point the toolbar and the
   filters are off the screen. The button obeys reduced-motion. It does not force a smooth
   return. */
// The name is NOT scrollTop. An inline handler resolves names against the element first, and
// Element.scrollTop is a number, so `onclick="scrollTop()"` throws "not a function".
function backToTop(){
  const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({top:0, behavior: smooth ? 'smooth' : 'auto'});
}
function syncToTop(){ $('#totop').classList.toggle('show', window.scrollY > 400); }
window.addEventListener('scroll', syncToTop, {passive:true});

syncNavHeight();
applyView();
applyUrlFilters();      // must run BEFORE syncFilterChips — it can replace the whole filter set
syncFilterChips();
initHeaderSort();
syncToTop();
load();
</script>
