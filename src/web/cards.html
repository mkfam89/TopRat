<div class="confirm-scrim" id="confirmScrim">
  <div class="confirm-box" role="dialog" aria-modal="true">
    <div class="confirm-title" id="confirmTitle"></div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <textarea class="confirm-reason" id="confirmReason" placeholder="Reason (optional)"></textarea>
    <div class="confirm-actions">
      <button class="btn" id="confirmCancel">Cancel</button>
      <button class="btn" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<button class="totop" id="totop" title="Back to top" aria-label="Back to top" onclick="backToTop()">↑</button>

<script>
let JOBS = [];
let GHOST_CAVEAT = '';
let CUSTOMIZE_THR = 0.8;   // skillMatch >= this => a ready template is used instead of AI tailoring
// Is the Claude integration present? /api/jobs derives this from the Claude Code CLI being
// installed — there is no on/off setting any more. Claude Code installed => the Tailor button
// shows the notes box, because Claude Code is what reads the notes.
let CLAUDE_ENABLED = false;
// Can this machine tailor unattended? (/api/claude-cli — is the Claude Code CLI present?)
// Tailoring runs on the user's Claude PLAN through `claude -p`; there is no API key and
// nothing metered. This drives the one-line notice in the tailoring block, so a user who
// queues a job learns here, not three days later, that they are getting template copies.
let AI_KEY = {available:false, binary:'', apiKeyInEnv:false};
let SORTDIR = 'desc';       // applies to whichever sort is selected; default = newest found first
let OPEN_ID = null;         // id whose card is currently previewed (for the .is-open outline)
const $ = s => document.querySelector(s);

/* ---------------- view mode (cards | table) ----------------
   Two presentations of ONE board. Both read currentList() — the same filtered, sorted array —
   and both call the same action handlers, so the views can never disagree about the data or
   fall out of sync the way a separately generated table page did.
   Starting view: the URL path wins (so /table stays a working bookmark), otherwise the last
   view the user chose, otherwise cards. */
const VIEW_KEY = 'board_view';
/* QUEUE MODE — this same page served at /queue as the Tailoring queue.
   It is not a copy of the board: it IS the board, in table view, scoped to queued jobs, with a
   Run-now bar on top. That is deliberate. The queue's job list, row expander, detail card, notes,
   status and resume controls are the ones the user already knows, and there is no second
   implementation to drift from them. Only three things change: the list is locked to queued jobs,
   the controls that could unlock it are hidden, and the row's Apply ↗ link becomes ✕ Un-queue. */
const QUEUE_MODE = (location.pathname === '/queue' || location.pathname === '/queue.html');
let VIEW = (function(){
  const p = location.pathname;
  if(QUEUE_MODE) return 'table';        // a queue is a worklist; the card grid is not one
  if(p === '/table' || p === '/job_tracker.html') return 'table';
  if(p === '/cards' || p === '/cards.html') return 'cards';
  try{ return localStorage.getItem(VIEW_KEY) === 'table' ? 'table' : 'cards'; }catch(e){ return 'cards'; }
})();

const SUBTEXT = {
  cards: 'Click a card to see the job at the right. The quick-skip control and <b>Move to applied</b> are in the top-right corner of the card.',
  table: 'Click any row to open the full job detail under it. Click the row again to close it. Click a column header to sort. The search and the filters apply to both views.',
  queue: 'These jobs wait for a tailored resume. A job comes here when you press <b>Tailor resume</b> on the board. Click any row to open the full job detail under it. The hourly pass builds these resumes by itself.',
};

function setView(v){
  if(QUEUE_MODE || v === VIEW) return;   // the queue has one presentation
  VIEW = v;
  try{ localStorage.setItem(VIEW_KEY, v); }catch(e){}
  // Update the address bar without a reload. A refresh or a copied link then opens the
  // same view.
  try{ history.replaceState(null, '', v === 'table' ? '/table' : '/'); }catch(e){}
  closeDetail();
  applyView();
  render();
}

function applyView(){
  document.body.classList.toggle('view-table', VIEW === 'table');
  document.body.classList.toggle('queue-mode', QUEUE_MODE);
  $('#vcards').classList.toggle('on', VIEW === 'cards');
  $('#vtable').classList.toggle('on', VIEW === 'table');
  $('#sub').innerHTML = QUEUE_MODE ? SUBTEXT.queue : SUBTEXT[VIEW];
  if(QUEUE_MODE){
    $('#pgtitle').textContent = '⏳ Tailoring queue';
    document.title = 'Top Rat — Tailoring queue';
  }
}
function ghostTip(j){ return 'Possible ghost job: ' + ((j.ghostReasons||[]).join('; ') || 'multiple risk signals')
  + (GHOST_CAVEAT ? ' — ' + GHOST_CAVEAT : ''); }
function locTip(j){
  const t = j.locationType || '';
  if(t==='Remote') return 'Tagged Remote because the posting’s location text contains “remote”.';
  if(t==='Hybrid') return 'Tagged Hybrid because the posting’s location text contains “hybrid”.';
  if(t==='Onsite') return 'Tagged Onsite. The posting lists a location with no “remote” or “hybrid” keyword.';
  if(t==='Location') return 'This older job has no recorded location. This tag is a placeholder.';
  return 'The app reads the work-location type from the location text of the posting.';
}
/* ---------------- salary DISPLAY format ----------------
   Pay arrives from the scrapers, the bands file and the Adzuna probe in whatever shape the source
   wrote it: "$110,000-$145,000 (est.)", "$120k-$160k/yr", "$106K", "$93,600-$98,800". Spelled out
   in full, that string is the widest thing in a 460px card's chip row and pushed the match and
   résumé chips onto a second line. fmtPay abbreviates every figure in it — K for thousands, M for
   millions — and leaves everything else (the separator, "/yr", "(est.)") exactly as written.

   DISPLAY ONLY. Nothing here touches the stored value: tracking.csv, job_tracker.json and the
   drawer's ✎ manual-override editor all still read and write the raw string, and payNum() still
   sorts on it, so the abbreviation can never change what the pipeline sees.

   Anything under 1,000 is left alone — that is an hourly rate ("$45/hr"), not a truncated salary.
   A figure that is not a whole K keeps one decimal ("$93,600" → "$93.6K") rather than rounding
   away a real difference between two bands. */
function payShort(n){ return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,''); }
function fmtPay(s){
  if(!s) return s;
  // The whitespace is INSIDE the optional suffix group on purpose: `\s*([kKmM])?` would eat the
  // space before "(est.)" and after "$100,000 -" on figures that carry no suffix at all.
  return String(s).replace(/(\d[\d,]*(?:\.\d+)?)(?:\s*([kKmM]))?(?![\w%])/g, (m, num, suf)=>{
    const v = parseFloat(num.replace(/,/g,'')) * (suf ? (suf.toLowerCase()==='k' ? 1e3 : 1e6) : 1);
    if(!isFinite(v)) return m;
    if(v >= 1e6) return payShort(v/1e6) + 'M';
    if(v >= 1e3) return payShort(v/1e3) + 'K';
    return m;                       // hourly rates and other sub-1000 figures stay verbatim
  });
}
function salaryTip(j){
  const s = (j.salarySource||'').toLowerCase();
  if(s==='manual') return 'You entered this salary manually. It overrides the figure that the app resolved.';
  if(s==='posted' || s==='posting') return 'Pay listed on the job posting itself.';
  if(s==='band') return 'The posting gives no pay. This figure comes from the salary band for this job family (config/salary_bands.json).';
  if(s==='jobsworth' || s==='probe' || s==='adzuna') return "An estimate from the salary predictor of Adzuna, based on the posting details.";
  return j.salaryEstimated ? 'An estimate. The posting gives no exact pay.' : 'The best salary figure available for this job.';
}
function empTip(j){
  const t = j.employmentType||'';
  return t ? (t+' role. The app flags it because the posting is not a standard full-time W2 position. '
             + 'The app finds this in the title, the location, or the job description.')
           : '';
}

// Remember which jobs the user clicked "Apply" on, but has not yet confirmed. The browser stores
// this, so the "did you apply?" banner survives across visits.
const APPLY_CLICKED_KEY = 'cards_apply_clicked';
function _acSet(){ try{ return new Set(JSON.parse(localStorage.getItem(APPLY_CLICKED_KEY)||'[]')); }catch(e){ return new Set(); } }
function _acSave(s){ try{ localStorage.setItem(APPLY_CLICKED_KEY, JSON.stringify([...s])); }catch(e){} }
function isApplyClicked(id){ return _acSet().has(id); }
function markApplyClicked(id){ const s=_acSet(); s.add(id); _acSave(s); }
function clearApplyClicked(id){ const s=_acSet(); s.delete(id); _acSave(s); }

const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function matchColor(m){ m=m*100; return m>=70?'#10b981':m>=40?'#d97706':'#dc2626'; }
// A white fill with a colored border and text for the skill-match chip (2026-07-31. It was a soft
// tint.) See the "job-detail tags" note above the .chip CSS rules. The border color and the text
// color still band the score, so the signal is the same. Only the fill is flat now, like the rest
// of the row.
function matchChip(m){
  m=m*100;
  if(m>=70) return 'background:#fff;color:#047857;border-color:#a7f3d0';
  if(m>=40) return 'background:#fff;color:#b45309;border-color:#fde68a';
  return 'background:#fff;color:#b91c1c;border-color:#fecaca';
}
function payNum(s){ const m=(s||'').replace(/[,]/g,'').match(/\$?\s*([\d.]+)\s*[kK]?/); if(!m) return 0;
  let n=parseFloat(m[1]); if(/k/i.test(s)&&n<1000) n*=1000; return n; }

async function load(){
  try{
    const r = await fetch('/api/jobs'); const d = await r.json();
    JOBS = d.jobs||[]; GHOST_CAVEAT = d.ghostCaveat||'';
    CLAUDE_ENABLED = !!d.claudeEnabled;
    BACKLOG = d.backlog || BACKLOG;
    if(typeof d.customizeThreshold==='number') CUSTOMIZE_THR = d.customizeThreshold;
  }catch(e){ JOBS=[]; }
  loadAiKey();
  render();
}

// CLI status for the drawer notice. Separate from /api/jobs so a slow or failed check never
// holds up the board — the notice simply stays hidden. Cheap: it looks for the binary, it
// does not start Claude. Settings → Check now is where the real round trip happens.
async function loadAiKey(){
  try{ AI_KEY = await (await fetch('/api/claude-cli')).json(); }
  catch(e){ /* file mode / offline — leave the notice out */ }
}

function toggleSortDir(){ SORTDIR = SORTDIR==='desc'?'asc':'desc'; render(); }
// Each sort reads its direction differently, so the button names the direction.
function sortDirLabel(){
  const s = $('#fsort').value, d = SORTDIR;
  const words = {
    found:   ['newest first','oldest first'],
    match:   ['highest first','lowest first'],
    pay:     ['highest first','lowest first'],
    title:   ['A → Z','Z → A'],
    company: ['A → Z','Z → A'],
  }[s] || ['descending','ascending'];
  // For text sorts, A–Z is ASCENDING. Flip which word belongs to which arrow.
  const isText = (s==='title'||s==='company');
  const txt = isText ? (d==='asc'?words[0]:words[1]) : (d==='desc'?words[0]:words[1]);
  return (d==='desc'?'↓ ':'↑ ') + txt;
}

/* ---------------- combinable filter chips ----------------
   TWO groups. Both are in the Filters panel of the toolbar. The first is work arrangement:
   Remote, Hybrid, Onsite, and Local, OR'd. The second is resume: tailored, templated,
   undetermined, and queued, OR'd. The app ORs the chips inside a group. It ANDs the groups. Both
   views read the same set through currentList(), so the table cannot drift.

   Local (data-f 'local') sits in the arrangement group but is NOT one of ARR_F / j.locationType —
   it filters on where the EMPLOYER is (profile commute radius, j.isLocal), which is a genuinely
   different axis from Remote/Hybrid/Onsite (a remote job based nearby still passes it). It reads
   as a fourth arrangement chip because that's the natural place to look for it, but currentList()
   keeps it as its own AND condition. It does not fold it into the arr OR-set. See below.

   The first three resume chips are the states that a resume can be in, and they divide the whole
   board. A job HAS a tailored resume. Or it has none, but its skill match clears CUSTOMIZE_THR,
   so the deterministic template path handles it. Or it is below the threshold and still open, and
   it needs an AI-tailored resume. A selection of all three is therefore no filter at all, by
   construction. 'queued' is a fourth member of the same group, and it is independent of the other
   three. A job can be queued in any of the three states. It was its own AND group until
   2026-07-31. */
const FILTER_KEY = 'board_filters';
const ARR_F = ['Remote','Hybrid','Onsite'];
// 'queued' is INSIDE the resume group now (2026-07-31). The app therefore ORs it with the three
// resume states. It does not AND it as its own group. All four answer the same question: "what is
// the state of the resume for this job?". A job is queued because it has no usable resume yet. The
// old AND reading, "queued AND tailored", described a combination that almost never exists.
// "Queued or already tailored" is what the pair is for.
const RESUME_F = ['tailored','templated','undetermined','queued'];
// The pill label for every filter key. The active row can then name a filter without reading the button.
const F_LABEL = {local:'📍 Local', Remote:'Remote', Hybrid:'Hybrid', Onsite:'Onsite',
                 tailored:'Tailored', templated:'Templated', undetermined:'None',
                 queued:'Queued'};
let FILTERS = (function(){
  let s;
  try{ s = new Set(JSON.parse(localStorage.getItem(FILTER_KEY)||'[]')); }catch(e){ return new Set(); }
  // Migrate the saved state from the old chip set. Without this, a returning user gets an
  // invisible filter that trims the board. 'ready' became 'tailored'. 'nonlocal' no longer exists.
  if(s.has('ready')){ s.delete('ready'); s.add('tailored'); }
  s.delete('nonlocal');
  // 'queued' does NOT survive a reload. Every other chip describes a standing preference ("I only
  // look at remote roles"); the queue is a worklist you visit and finish. Restoring it opened the
  // board on the queue — a narrow slice of it — when the default landing state is the full Pending
  // list. A link that names filters (?filter=queued) still wins: applyUrlFilters replaces this set.
  s.delete('queued');
  return s;
})();
function saveFilters(){ try{ localStorage.setItem(FILTER_KEY, JSON.stringify([...FILTERS])); }catch(e){} }
function toggleFilter(f){
  if(FILTERS.has(f)) FILTERS.delete(f);
  else FILTERS.add(f);
  saveFilters(); syncFilterChips(); render();
}
function clearFilters(){ FILTERS.clear(); saveFilters(); syncFilterChips(); render(); }

/* ---------------- filters from the URL ----------------
   `?filter=queued,local&status=all` opens the board already narrowed. This is what the Queued
   chip and the "See the tailoring queue" menu row link to, and it makes any filtered board a
   link you can copy or bookmark.
   The URL is AUTHORITATIVE when it names filters: it REPLACES the saved set rather than adding
   to it. A link to the queue must never arrive pre-narrowed by whatever the last visit left in
   localStorage — "queued + Remote" would show a queue that is missing jobs and say nothing about
   why. It then persists like any chip press, because the next thing you do in that tab is toggle
   a chip and expect it to stick.
   `status` matters as much as `filter` here: a queued job can already be applied or skipped, and
   the default Pending list would hide it. Unknown keys are dropped, so a stale link can only ever
   show LESS filtering, never an error. */
function applyUrlFilters(){
  let p; try{ p = new URLSearchParams(location.search); }catch(e){ return; }
  const valid = new Set(['local'].concat(ARR_F, RESUME_F));
  const raw = p.get('filter');
  if(raw !== null){
    FILTERS = new Set(raw.split(',').map(s=>s.trim()).filter(s=>valid.has(s)));
    saveFilters();
  }
  const st = p.get('status'), sel = $('#fstatus');
  if(st && sel && [...sel.options].some(o=>o.value===st)) sel.value = st;
  const q = p.get('q');
  if(q && $('#q')) $('#q').value = q;
}

/* The tailoring queue is its own PAGE now (/queue, a nav tab), not this board wearing
   ?filter=queued in a second tab. Two reasons the old reading was wrong: a queue is a short
   ordered worklist rather than a job board, and it has one action the board cannot offer —
   RUN IT NOW. It also opens in THIS tab: a spawned tab is a tab the user has to close, and the
   board is one nav click back. Every entry point (the Queued bubble on a card or table row, the
   Queued chip in the drawer header, the Tailor ▾ menu) lands on the same page. */
function queueUrl(){ return '/queue'; }
function openQueueView(ev){
  if(ev && ev.stopPropagation) ev.stopPropagation();
  location.href = queueUrl();
}
// The panel is a popover. It closes on an outside click and on Escape. It does NOT close when
// you press a chip inside it. You choose filters in combinations. If the panel closed after each
// choice, a set of three chips needs three round trips.
function toggleFilterPanel(ev){
  if(ev) ev.stopPropagation();
  const p = $('#fpanel');
  setFilterPanel(p.hidden);
}
function setFilterPanel(open){
  $('#fpanel').hidden = !open;
  $('#fbtn').setAttribute('aria-expanded', open ? 'true' : 'false');
}
document.addEventListener('click', e=>{
  const w = $('#fwrap');
  if(w && !w.contains(e.target)) setFilterPanel(false);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') setFilterPanel(false); });
function syncFilterChips(){
  document.querySelectorAll('.fchip').forEach(b=>b.classList.toggle('on', FILTERS.has(b.dataset.f)));
  const n = FILTERS.size;
  $('#fclear').hidden = n===0;
  const badge = $('#fcount'); badge.hidden = n===0; badge.textContent = n;
  $('#fbtn').classList.toggle('active', n>0);
  // Mirror the set as removable pills. The app renders them in the declared group order, not in
  // the Set insertion order. The row then reads the same way every time.
  const host = $('#factive');
  host.hidden = n===0;
  host.innerHTML = '';
  if(!n) return;
  const lab = document.createElement('span');
  lab.className = 'flabel'; lab.textContent = 'Filtered by';
  host.appendChild(lab);
  ['local'].concat(ARR_F, RESUME_F).filter(f=>FILTERS.has(f)).forEach(f=>{
    const b = document.createElement('button');
    b.className = 'fpill'; b.title = 'Remove this filter';
    b.innerHTML = '<span></span><span class="x">✕</span>';
    b.firstChild.textContent = F_LABEL[f] || f;
    b.onclick = ()=>toggleFilter(f);
    host.appendChild(b);
  });
}
function hasResume(j){ return !!(j.hasResume || j.resumePath); }
// This is the same rule that the detail card uses for its TEMPLATE badge (see the resume row).
// At or above the threshold, the app uses a ready-made base resume instead of an AI-tailored one.
// One function holds the rule, so the chip and the badge can never disagree about "templated".
function resumeState(j){
  if(hasResume(j)) return 'tailored';
  return (j.skillMatch||0) >= CUSTOMIZE_THR ? 'templated' : 'undetermined';
}

/* The board's one filtered+sorted list, shared by both views.
   `over` overrides a condition without touching the controls: currentList({filters:new Set()})
   answers "what would the board show if the filters were off?". renderEmpty uses it to test each
   undo before offering it, so it never shows a Clear-filters button that would leave the board
   just as empty. Nothing else passes it, and the default is exactly the old behaviour. */
function currentList(over){
  const o = over || {};
  const q = (o.q !== undefined ? o.q : $('#q').value).trim().toLowerCase();
  const fs = o.fs !== undefined ? o.fs : $('#fstatus').value;
  const F = o.filters || FILTERS;
  const arr = ARR_F.filter(a=>F.has(a));
  const res = RESUME_F.filter(r=>F.has(r));
  let list = JOBS.filter(j=>{
    // Queue mode: one condition decides membership, and it is not negotiable — a filter or a
    // status list that could drop a queued job would make the queue's own count wrong. Search
    // still applies (it narrows what you LOOK at, it does not claim the queue is shorter).
    if(QUEUE_MODE){
      if(!j.queued) return false;
      if(q){
        const hay = (j.company+' '+j.role+' '+(j.missingSkills||[]).join(' ')+' '+j.location).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    }
    if(F.has('local') && !j.isLocal) return false;
    if(arr.length && !arr.includes(j.locationType||'')) return false;
    // 'queued' is a member of this group. It is not a separate AND. See RESUME_F.
    if(res.length && !res.some(r=> r==='queued' ? !!j.queued : r===resumeState(j))) return false;
    if(fs==='banned'){ if(!j.blocked) return false; }
    else {
      // Banned jobs are only in the Banned list. There is one exception: a job banned in this
      // session stays in place, struck through, so you can undo the ban immediately.
      if(j.blocked && !JUST_BANNED.has(normCo(j.company))) return false;
      // 'untailored' (j.candidate) left the status list in 2026-08. It answered a resume question
      // from a list about application status, and the Resume filter chips (None / Templated /
      // Tailored / Queued) answer it in the group where it belongs.
      if(fs==='active' && j.status!=='pending') return false;
      if(fs==='applied' && j.status!=='applied') return false;
      if(fs==='skipped' && j.status!=='skipped') return false;
      if(fs==='bookmarked' && !j.bookmarked) return false;
    }
    if(q){
      const hay = (j.company+' '+j.role+' '+(j.missingSkills||[]).join(' ')+' '+j.location).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  // One ASCENDING comparator for each sort. SORTDIR flips it. Every sort then gets both
  // directions from one control, and no field needs a fixed direction.
  const sort = $('#fsort').value;
  const dir = SORTDIR==='asc' ? 1 : -1;
  list.sort((a,b)=>{
    let c = 0;
    if(sort==='match') c = (a.skillMatch||0)-(b.skillMatch||0);
    else if(sort==='found') c = (a.foundDate||'').localeCompare(b.foundDate||'');
    else if(sort==='pay') c = payNum(a.salary)-payNum(b.salary);
    else if(sort==='company') c = (a.company||'').localeCompare(b.company||'');
    else if(sort==='title') c = (a.role||'').localeCompare(b.role||'');
    return c*dir;
  });
  return list;
}

// The tailoring state is in two parts, because the two parts sit in different places on a card.
// The queue tag is next to the company name, with a blue card tint. "resume ready" stays in the
// chip row with the other attributes.
/* ---------------- the user's own ghost flag ----------------
   This is not the 👻 icon. That icon is a GUESS from the heuristics in ghost_risk.py. This flag
   is you saying "I think this posting is fake". The app records it in config/ghost_flags.json and
   counts it for each employer. By design it changes NOTHING else. It does not skip, unqueue, or
   filter. The flagged card turns ghost gray, and you set the status yourself. It drives one
   behavior only: the ban offer on the second flagged posting from the same employer. */
/* ---------------- card corner controls ----------------
   The top-right group of the card holds the actions that you take WHILE YOU READ the list: note,
   bookmark, skip, and mark applied. It also holds the one status that changes your next action:
   queued. The ghost flag and the ban left this group for the detail card. Both are judgements
   about the employer, and you make them after you read the posting. They are not fast actions,
   and they filled the corner. */
// A quick note directly from a card. No note = a hollow icon. A note = a filled icon. Both go to
// the SAME expanded note footer of the detail card (openNote), so there is one place to write a note.
function noteBtn(j){
  return `<button class="qbtn note${j.note?' on':''}" title="${j.note?'Open your note':'Add a quick note'}"
                  onclick="openNote('${j.id}')">${j.note?NOTE_ON_ICON:NOTE_ICON}</button>`;
}
function bookBtn(j){
  return `<button class="qbtn book${j.bookmarked?' on':''}" title="${j.bookmarked?'Bookmarked — click to remove':'Bookmark this job'}"
                  onclick="toggleBookmark('${j.id}')">${j.bookmarked?'★':'☆'}</button>`;
}
// Tags that stay WITH the employer name, in every view. These two facts change how you read the
// name. In the chip row below, pay and match hid them.
function nameTags(j){
  let t = '';
  if(j.blocked)
    t += `<span class="tag banned" title="This employer is banned. Their postings leave the board on your next reload.">banned</span>`;
  if(j.ghostFlagged){
    const n = j.ghostFlagCount||1;
    t += `<span class="tag gflag" title="You flagged ${n>1?(n+' postings from this employer'):'this posting'} as a possible ghost job">👻 ghost${n>1?' ×'+n:''}</span>`;
  }
  return t;
}
// Detail card only: the same name-tag row, plus the two facts that the mini card shows through
// its background tint and watermark (bookmarked, applied). The big card has no watermark, so
// those two facts need their own bubble here, in the same place as banned and ghost.
function dheadTags(j){
  let t = nameTags(j);
  if(j.bookmarked)
    t += `<span class="tag book" title="Bookmarked">★ bookmarked</span>`;
  if(j.status==='applied')
    t += `<span class="tag applied" title="Marked applied">applied</span>`;
  return t;
}

/* The queued hourglass as inline SVG — one drawing shared by every place the queue is named
   (detail-card chip, tailor button, table chip + flag strip). The card's wallpaper version is the
   same geometry as a data-URI in .card.is-queued::after; edit both together. */
const HG_ICON = `<svg class="hg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">`
  + `<rect x="3.4" y="1.6" width="17.2" height="2.5" rx="1.25"/>`
  + `<rect x="3.4" y="19.9" width="17.2" height="2.5" rx="1.25"/>`
  + `<path d="M6.6 4.1c0 4.2 4.6 6.3 4.6 7.9s-4.6 3.7-4.6 7.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>`
  + `<path d="M17.4 4.1c0 4.2-4.6 6.3-4.6 7.9s4.6 3.7 4.6 7.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>`
  + `<path d="M7.8 6.6h8.4c0 3.1-3.6 4.3-3.6 5.6v4.4h-1.2v-4.4c0-1.3-3.6-2.5-3.6-5.6z"/>`
  + `<path d="M7.3 19.5c.8-2.1 2.7-3.3 4.7-3.3s3.9 1.2 4.7 3.3z"/></svg>`;
/* "Put this back": a ring with the arrow that closes it. It replaces the 🔄 emoji. As a drawing
   it is always a GREEN ring on the unban controls (see the .rg rules). The emoji takes whatever
   color the platform font gives it. Everywhere else this icon takes the color of its button. */
const RING_ICON = `<svg class="rg" viewBox="0 0 24 24" fill="none" stroke="currentColor"`
  + ` stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`
  + `<path d="M20.2 12a8.2 8.2 0 1 1-2.4-5.8"/><path d="M20.6 3.4v5.2h-5.2"/></svg>`;

/* ---------------- toggle icons ----------------
   ICON = STATE. For the ghost flag, a press in the ON state undoes what the OFF state does. The
   pair is therefore not "empty against filled". The ON icon shows the undo: the ghost struck
   through in red means un-flag. The note is the exception. It opens the note in both states, so
   its pair is blank paper against written-on paper. All icons are flat and take currentColor,
   like the hourglass and the ring.
   (The 👎 SKIP_ICON was here. It left with the status buttons for each transition. Skip is now a
   row in the Status ▾ menu, not its own button.) */
const ICO_OPEN = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"`
  + ` stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`;

// OFF: a blank sticky note. ON: the same note with writing on it.
const NOTE_ICON = ICO_OPEN
  + `<path d="M14.6 3.4H5.4a2 2 0 0 0-2 2v13.2a2 2 0 0 0 2 2h8.2l7-7V5.4a2 2 0 0 0-2-2z"/>`
  + `<path d="M13.6 20.6v-4a2 2 0 0 1 2-2h4"/></svg>`;
const NOTE_ON_ICON = ICO_OPEN
  + `<path d="M14.6 3.4H5.4a2 2 0 0 0-2 2v13.2a2 2 0 0 0 2 2h8.2l7-7V5.4a2 2 0 0 0-2-2z"/>`
  + `<path d="M13.6 20.6v-4a2 2 0 0 1 2-2h4"/>`
  + `<path d="M7 8.2h9M7 11.8h9M7 15.4h4.6"/></svg>`;

/* OFF: a plain outline ghost in currentColor, like every other icon here.
   ON: the FRIGHTENED GHOST from Pac-Man. It is the blue ghost that appears after the power pellet,
   when the ghost stops the chase and runs away. A flag on a possible ghost job is the same moment,
   so the pressed state is the scared sprite. The pressed state used to be a red struck-through
   ghost. A red no-entry ring reads as "banned", and that control is two buttons away. The red
   ghost also said "un-flag" so quietly that the flag looked like it had failed.
   This icon is filled, not ICO_OPEN (fill:none, stroke:currentColor). It sets its own colors. The
   arcade blue and the white face are the point, so this one icon does NOT take the color of its
   button. Geometry: a dome top, the 4-lobe zigzag skirt, two square eyes, and the zigzag mouth of
   the sprite. */
const GHOST_BODY = `<path d="M4.9 20.8V10.4a7.1 7.1 0 0 1 14.2 0v10.4l-2.37-1.93-2.36 1.93L12 18.87l-2.37 1.93z"/>`
  + `<circle cx="9.6" cy="10.5" r=".95" fill="currentColor" stroke="none"/>`
  + `<circle cx="14.4" cy="10.5" r=".95" fill="currentColor" stroke="none"/>`;
const GHOST_ICON = ICO_OPEN + GHOST_BODY + `</svg>`;
const GHOST_OFF_ICON = `<svg class="ic gscared" viewBox="0 0 24 24" aria-hidden="true">`
  // body: left side up, arc over the top, right side down, then the zigzag skirt back to the left
  + `<path fill="#2121de" d="M3.4 21.2v-9.6a8.6 8.6 0 0 1 17.2 0v9.6`
  + `l-2.15-2.3-2.15 2.3-2.15-2.3-2.15 2.3-2.15-2.3-2.15 2.3-2.15-2.3z"/>`
  // frightened face: plain square eyes (no pupils — the sprite's eyes go blank while it flees)
  + `<rect x="7.9" y="9.7" width="2.9" height="3.4" rx=".7" fill="#fff"/>`
  + `<rect x="13.2" y="9.7" width="2.9" height="3.4" rx=".7" fill="#fff"/>`
  // and the zigzag mouth
  + `<path d="M6.7 17.2l1.75-1.9 1.75 1.9 1.8-1.9 1.75 1.9 1.75-1.9 1.75 1.9" fill="none"`
  + ` stroke="#fff" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round"/></svg>`;

/* The leading action of the detail card: open the posting. On an applied or a skipped job this
   button used to become "Move to pending". That is the duplication that the Status ▾ menu removed.
   "Move to pending" on an applied job and "Un-skip" on a skipped job were one move with two names.
   A link to the posting is useful in EVERY state, so the button always does that. The words follow
   the state: after you apply, you return to read, not to apply again. The Status button beside it
   moves a job between lists. */
function applyBtn(j){
  const applied = statusOf(j)==='applied';
  return `<button class="btn st-pending" title="Open the original posting in a new tab"
                  onclick="doApply('${j.id}')">↗ ${applied?'View Posting':'Apply'}</button>`;
}

// The drawer header's queue tag. It is a BUTTON, and it opens the SAME tailoring menu as the
// résumé bubble and the split button below it — edit the instructions, see the whole queue, or
// unqueue. One tag, one menu, wherever "Queued" is written on the board.
function queuedChip(j){
  return j.queued ? `<button class="chip queued" title="In the tailoring queue. The queue processor builds this resume. Click for the queue options."
                  onclick="openTailorMenu(event,'${j.id}')">${HG_ICON}Queued<span class="caret">▾</span></button>` : '';
}
// The résumé file's own URL — PDF first (a browser renders it), then the .docx, then whatever
// path the tracker stored. ONE lookup, so the bubble, the drawer chip and the preview pane can
// never point at different files. Empty string when the job has no résumé.
function resumeHref(j){
  const p = j.resumePdf || j.resumeDocx || j.resumePath || '';
  return p ? '/' + encodeURI(p) : '';
}
// Open the résumé in its own tab. This is what a click on a "tailored" tag does, in EVERY view.
// A status tag that says a file exists should hand you the file; it used to name it in a toast,
// which told you what you already read. Falls back to the toast when no file path came back.
function openResumeTab(id){
  const j = jobById(id); if(!j) return;
  const href = resumeHref(j);
  if(!href){ toast('A tailored resume exists for this job, but no file path was recorded.'); return; }
  window.open(href, '_blank', 'noopener');
}
/* ---------------- tailoring errors — ONE tag, every reason ----------------
   Anything that stops the tailoring queue from producing a résumé ends up here: a base resume
   that is not in resume_template/, a render the formatting check rejected, a failed copy, an
   unreadable content file, a Claude pass that fell back to the template, a PDF conversion that
   did not run. `/api/jobs` returns them in ONE field (`tailorError = {code, message, detail, at,
   stage, predicted}`), so the board does not need a branch per reason and a new failure reason
   in tailor_local.py shows up here with no UI change at all.

   The tag goes exactly where the résumé NAME or status would have been, because that is where
   you look to find out what was built. The old design put one of these reasons — the missing
   template — as a sentence of prose inside the big card, which meant the board's mini card and
   table said "Templated" for a job whose template does not exist. A status that is wrong is
   worse than a status that is short. The tag is short and it is honest; the sentence moved into
   the dialog behind a click, where there is room for the cause AND the fix. */
function tailorErr(j){ const e = j && j.tailorError; return (e && e.code) ? e : null; }
const ERR_TITLE = {
  template_missing:  'The base resume file is missing',
  template_none:     'resume_template/ holds no base resume',
  render_rejected:   'The formatting check rejected the resume',
  copy_failed:       'The app did not write the resume file',
  content_unreadable:'The app did not read the tailoring content file',
  ai_failed:         'Claude did not tailor this resume',
  pdf_failed:        'The app did not make the PDF copy',
};
// What to DO about it. The message states the cause; a person still has to be told the fix, and
// every one of these is fixed outside the board, so no dialog button can do it for you.
const ERR_FIX = {
  template_missing:  'Put the file in resume_template/, then run the tailoring queue again.',
  template_none:     'Add at least one base resume (.docx or .pdf) to resume_template/. If the folder looks full, check that Settings → data folder points at the right place.',
  render_rejected:   'The rules are in CLAUDE.md (font floor, section set, minimum bullets per role). The job stays queued and is retried on the next run.',
  copy_failed:       'Check that the New/ folder is writable and that the file is not open in Word.',
  content_unreadable:'Delete or fix the content file for this job, then queue it again.',
  ai_failed:         'Check Settings → Claude integration. The template copy is still a valid resume to send.',
  pdf_failed:        'Install or repair LibreOffice if an ATS upload needs the PDF. The .docx is unaffected.',
};
// The error tag as it appears where a résumé file NAME would be printed (big card, queue table).
function errTag(j, label){
  const e = tailorErr(j); if(!e) return '';
  return `<button class="errtag" title="${esc((ERR_TITLE[e.code]||'Tailoring error') + ' — click for details')}"
                  onclick="event.stopPropagation();showTailorError('${j.id}')">⚠ ${esc(label||'Tailoring error')}</button>`;
}
// The dialog. Cause, then the exact thing that failed, then the fix, then where the job stands
// now — in that order, because that is the order the questions arrive in.
function showTailorError(id){
  const j = jobById(id); if(!j) return;
  const e = tailorErr(j); if(!e) return;
  const lines = [e.message || 'The tailoring queue did not build a resume for this job.'];
  if(e.detail && e.detail !== e.message) lines.push('Details: ' + e.detail);
  if(ERR_FIX[e.code]) lines.push('Fix: ' + ERR_FIX[e.code]);
  if(e.predicted) lines.push('This is checked before the queue runs, so nothing has failed yet — '
                           + 'the run will fail this way unless the file is there.');
  else if(e.at) lines.push('Last tailoring run: ' + e.at.replace('T', ' '));
  if(j.queued) lines.push('The job is still in the tailoring queue. It is retried on every run.');
  openConfirm({
    title: ERR_TITLE[e.code] || 'Tailoring error',
    message: lines.join('\n\n'),
    confirmLabel:'Got it', infoOnly:true, danger:false, showReason:false
  });
}

// The drawer's ✓ tailored tag. Same click target as the mini card's and the table's bubble:
// it opens the file in a new tab (openResumeTab). It is a BUTTON for that reason.
function tailorChip(j){
  if(j.queued) return '';
  if(j.hasResume || j.resumePath) return `<button class="chip done" title="A tailored resume exists for this job. Click to open it in a new tab."
                  onclick="event.stopPropagation();openResumeTab('${j.id}')">✓ tailored</button>`;
  return '';
}

/* ---------------- the résumé status bubble — ONE control in both listings ----------------
   The mini card and the table used to show DIFFERENT things here. The chip row of the card spoke
   only when a résumé already existed (tailorChip, blank in every other case). The Resume column of
   the table held a group of separate buttons: 📄 View, ✎ re-tailor, ✕ unqueue, and a bare "Tailor"
   button. With the Claude assistant off, that Tailor button queued the job AT THE MOMENT OF THE
   CLICK. A plain status readout also wrote data. Both views had the same fault, so both get the
   same correction: one bubble. It always shows which state of the Resume filter the job is in:
   Tailored, Templated, None, or Queued. F_LABEL and resumeState are the SAME lookup that the
   filter chips use, so the two can never disagree. The bubble is text only, with no icon, and a
   click on it never queues anything by itself:
   - Queued → it wears a ▾ and opens the SAME tailoring menu as the drawer's split button
     (openTailorMenu): ✎ Edit instructions · ⏳ Go to the tailoring queue · ✕ Un-queue. ("Un-queue", not "Remove", everywhere the action appears — the row button on /queue, this menu, and the drawer — so one action never wears two names.)
     Queued is the only résumé state with anything to decide, and the decision people make most
     while scanning is "take it back out" — that used to cost a click into the big card, a scroll
     to the instructions box, and a click there. The other two states have nothing to choose, so
     they stay plain buttons. Unqueueing is still a menu row, never the bubble's own press: a
     status readout must not write anything by itself.
   - It has a résumé (Tailored) → it OPENS THE FILE IN A NEW TAB (openResumeTab), the PDF twin when
     there is one. It used to name the file in a toast, which told you what the tag had already
     told you and left the file two clicks away. Reading the tag and reading the résumé are the
     same intent, so they are now the same click. The tag is still read-only: a new tab writes
     nothing. The drawer's ✓ tailored chip does the same thing, so "tailored" is one click with
     one meaning everywhere it is written.
   - Neither → it asks first: "Tailor a resume for this job?". On yes only, it opens the big card
     at the tailoring-instructions section (promptTailor). That is the SAME place that the Tailor
     button of the card uses. A queue action stays a deliberate press inside the drawer. It is
     never a side effect of reading a status bubble. */
function resumeBubble(j, cls){
  // An ERROR outranks every other state, INCLUDING Queued: most failures leave the job in the
  // queue, so a "Queued" bubble would hide the very reason it is still sitting there. The filter
  // lookup (resumeState / F_LABEL) is deliberately NOT touched — this is a display rank on top
  // of it, so the Resume filter chips keep meaning exactly what they meant.
  const err = tailorErr(j);
  const st = err ? 'error' : j.queued ? 'queued' : resumeState(j);
  /* "None" is the DEFAULT state — no résumé, nothing queued, nothing wrong — and it is the state
     most of the board is in. A bubble that says only "nothing has happened here yet" earned a slot
     in the busiest row of the card while telling you nothing you couldn't read from its absence,
     so the bubble stays silent for it. The other three states all report something that HAPPENED
     (a file exists, it is in the queue, it failed) and still speak. Nothing is lost: the Resume
     filter chip "None" still selects these jobs, the drawer's Resume row still spells the state
     out, and the way to start a tailoring run was always the drawer's Tailor button, never this
     bubble. The table keeps a cell here (see resumeCell) — a blank column reads as broken. */
  if(st === 'undetermined') return '';
  const label = err ? '⚠ Error' : j.queued ? 'Queued' : F_LABEL[st];
  const tip = err ? (ERR_TITLE[err.code] || 'The tailoring queue did not build this resume') + '. Click for details.'
             : j.queued ? 'In the tailoring queue. Click for the queue options: edit the instructions, see the whole queue, or take this job out.'
             : hasResume(j) ? 'Résumé: Tailored. Click to open it in a new tab.'
                       : 'Résumé: ' + label + '. Click for details.';
  const caret = (!err && j.queued) ? '<span class="caret">▾</span>' : '';
  return `<button class="resbtn st-${st}${cls?' '+cls:''}" title="${esc(tip)}"
                  onclick="event.stopPropagation();resumeBubbleClick(event,'${j.id}')">${esc(label)}${caret}</button>`;
}
function resumeBubbleClick(ev, id){
  const j = jobById(id); if(!j) return;
  if(tailorErr(j)){ showTailorError(id); return; }   // same rank as the bubble's label
  if(j.queued){ openTailorMenu(ev, id); return; }
  if(hasResume(j)){ openResumeTab(id); return; }
  openConfirm({
    title:'Tailor a resume for this job?',
    message:'This job has no resume yet. The tailoring controls open in the detail card. Nothing enters the queue until you press Tailor there.',
    confirmLabel:'Take me there', danger:false, showReason:false,
    onConfirm:()=>promptTailor(id)
  });
}

// Questionnaire chip: the LLM tailoring pass writes 2-5 gap questions per customized job.
// Answered ones go green so the card shows at a glance what still needs a reply.
function questChip(j){
  const n = (j.questionnaire||[]).length;
  if(!n) return '';
  const done = !!(j.answers||'').trim();
  return `<span class="chip quest ${done?'answered':''}" title="${done?'Questionnaire answered. Your answers go to the next tailoring pass.':'Claude asked '+n+' question'+(n>1?'s':'')+' about this application'}">`
       + `📋 ${done?'answered':n+' question'+(n>1?'s':'')}</span>`;
}

/* ---------------- the pending-job cap ----------------
   The searches pause themselves once the pending list reaches the cap (backlog.py; the same
   state the scheduler gates on, delivered on /api/jobs so the number here and the list below
   it come from one response). Everything in here is DISPLAY plus two explicit button presses —
   no polling, nothing automatic, and the pause itself is computed server-side, so this file
   never has to know whether the searches are running.

   The banner exists because a paused search is silent. Nothing errors, the board is not empty,
   and the only symptom is that new postings stop appearing — which looks exactly like a quiet
   week in the job market. Left unexplained, the user's next move is to go hunting through the
   Schedule page for a scraper they think has broken. */
let BACKLOG = {count:0, cap:0, enabled:false, over:false, paused:false, hourlyOn:true};
let BL_BUSY = '';          // '' | 'skip-all' | 'delete-all' — a run in flight, so the buttons lock

/* Dismiss is DELIBERATELY not remembered. It clears on the next page load, because the thing it
   hides is still true: the searches are still holding off. A stored dismiss would turn a "not
   now" into a permanent silence, and the one symptom of the pause — no new postings — is
   exactly what a user reads as "the searches are working, the market is quiet".
   It also comes straight back the moment the user acts on the searches (backlogRemind below). */
let BL_DISMISSED = false;

// Show the nudge from 80% of the cap. Early enough to act on, late enough not to nag: the
// point is that "the searches are about to stop" should never be a surprise.
const BL_WARN_AT = 0.8;

function backlogNote(){
  // What the user is asked to decide, once. Kept out of the markup builder so the copy is
  // readable and so the confirm dialogs can reuse the same words the banner used.
  const n = BACKLOG.count;
  return {
    n,
    skip: 'Mark all ' + n + ' as skipped?\n\n'
        + 'You lose nothing. Every posting keeps its details, its notes and its link, and moves '
        + 'to the Skipped list. You can set any of them back to Pending later.\n\n'
        + 'The searches start again after this action.',
    del:  'Delete all ' + n + ' from the board?\n\n'
        + 'CAUTION: You cannot undo this action from the board. The app removes the postings, '
        + 'their details and their notes. It keeps no record of them, so a later search can find '
        + 'some of them again.\n\n'
        // A bookmark is the one signal that a posting was kept on purpose. It is named here
        // because the button says "all", and "all" is exactly what would take them with it.
        + (BACKLOG.bookmarked ? BACKLOG.bookmarked + ' of them '
             + (BACKLOG.bookmarked===1 ? 'is bookmarked, and the app deletes it too.'
                                       : 'are bookmarked, and the app deletes them too.') + '\n\n' : '')
        + 'To keep the record, choose Cancel. Skip all keeps everything.'
  };
}

// The board is empty AND the hourly search is switched off: no postings are waiting, so the cap
// is not what stopped them — the task that finds them is off. Same silence, same bubble.
function searchIdle(){
  const b = BACKLOG || {};
  return b.hourlyOn === false && !b.count;
}

function renderBacklog(){
  const el = $('#blbanner'); if(!el) return;
  const b = BACKLOG || {};
  // The queue page is a worklist of resumes you asked for. The cap is about the SEARCH board,
  // and its buttons act on jobs that are not in this list — so the banner would be offering to
  // change things the page does not show.
  const near = b.enabled && !b.paused && b.cap>0 && b.count >= Math.ceil(b.cap*BL_WARN_AT);
  const idle = searchIdle();
  // The two states with a Dismiss button are the two the user can silence. The near-cap nudge
  // has no Dismiss (it has nothing to decide yet), so it is not dismissable either.
  if(QUEUE_MODE || (BL_DISMISSED && (b.paused || idle))
     || (!idle && (!b.enabled || (!b.paused && !near)))){
    el.hidden = true; el.className='blbanner'; return;
  }
  el.hidden = false;
  if(idle && !b.paused){
    // Same bubble, other cause. It says WHY nothing is arriving and links to the one switch that
    // fixes it — Dismiss only, because there is no board full of postings to skip or delete.
    el.className = 'blbanner';
    el.innerHTML =
      '<div class="bltext">'
      + '<div class="bltitle">⏸ The job searches are paused</div>'
      + '<div class="blbody">The <b>hourly search</b> is off, and no job waits on the board. '
      + 'No new postings arrive.</div>'
      + '<div class="blfoot">Turn it on again under Scheduled tasks, or run a search there '
      + 'yourself. Nothing else stops it.</div>'
      + '</div><div class="blacts">'
      + '<button class="ui-btn sm primary" onclick="location.href=\'/schedule\'">Scheduled tasks</button>'
      + '<button class="ui-btn sm" onclick="dismissBacklog()">Dismiss</button></div>';
    return;
  }
  if(!b.paused){
    // Near the cap: state the fact and what will happen. No buttons — there is nothing to
    // decide yet, and a Delete-all button on a board that is still working would be a trap.
    el.className = 'blbanner soft';
    el.innerHTML =
      '<div class="bltext"><div class="bltitle">Your board is nearly full</div>'
      + '<div class="blbody"><b>' + b.count + ' of ' + b.cap + '</b> jobs wait for a decision. '
      + 'At ' + b.cap + ', the searches pause until you clear some.</div></div>'
      + '<div class="blacts"><button class="ui-btn sm" onclick="showPending()">Review them</button></div>';
    return;
  }
  el.className = 'blbanner';
  // Dismiss, not "Review them": the pending list is the board right underneath this bubble, so
  // the button only ever scrolled the user to what they were already looking at. What was
  // missing was a way to put the bubble down for now — the two real decisions stay beside it.
  const busy = BL_BUSY
    ? '<span class="blbusy">' + (BL_BUSY==='skip-all' ? 'Skipping…' : 'Deleting…') + '</span>'
    : '<button class="ui-btn sm" onclick="dismissBacklog()">Dismiss</button>'
      + '<button class="ui-btn sm" onclick="backlogAct(\'skip-all\')">Skip all ' + b.count + '</button>'
      + '<button class="ui-btn sm bldel" onclick="backlogAct(\'delete-all\')">Delete all ' + b.count + '</button>';
  el.innerHTML =
    '<div class="bltext">'
    + '<div class="bltitle">⏸ The job searches are paused</div>'
    + '<div class="blbody"><b>' + b.count + ' jobs</b> are waiting on a decision, and the limit is '
    + '<b>' + b.cap + '</b>. The scheduled searches wait, so the board does not continue to grow.'
    + '<br><b>Skip all</b> keeps every posting and its details, in the Skipped list. '
    + '<b>Delete all</b> removes them from the board permanently.</div>'
    + '<div class="blfoot">If the count goes under ' + b.cap + ', the searches start again by '
    + 'themselves. Your scheduled tasks stay on. The app turned nothing off.</div>'
    + '</div><div class="blacts">' + busy + '</div>';
}

// "Review them" = the Pending list with nothing else narrowing it. A filter or a search left on
// from earlier would show fewer jobs than the banner just claimed were waiting.
function showPending(){
  $('#q').value = ''; $('#fstatus').value = 'active';
  FILTERS.clear(); saveFilters(); syncFilterChips();
  if(VIEW !== 'table') setView('cards'); else render();
  $('#blbanner').scrollIntoView({block:'start', behavior:'smooth'});
}

function dismissBacklog(){ BL_DISMISSED = true; renderBacklog(); }

/* Bring the bubble back. Called whenever the user tries to make the searches DO something —
   from this page, from the nav popover's Run now, or on arriving here after a run started on
   the Scheduled tasks page. A search started while the board is full will find postings and
   then have nowhere to put them, and a search started while the hourly task is off is a
   one-off that will not repeat: in both cases the bubble is the answer to "why is nothing
   showing up?", so a dismiss must not outlive the question being asked again.
   Safe to call at any time — it shows nothing unless a bubble state actually holds. */
function backlogRemind(){
  BL_DISMISSED = false;
  renderBacklog();
  const el = $('#blbanner');
  if(el && !el.hidden) el.scrollIntoView({block:'start', behavior:'smooth'});
}
// The nav popover lives in every page's shell, not in this file, so it reaches the board
// through this one name (and does nothing on a page that does not define it). A run started
// from the Scheduled tasks page needs no hook at all: coming back here is a fresh page load,
// and a dismiss never survives one.
window.backlogRemind = backlogRemind;

async function backlogAct(action){
  if(BL_BUSY) return;
  const c = backlogNote();
  if(!c.n) return;
  if(!confirm(action==='skip-all' ? c.skip : c.del)) return;
  BL_BUSY = action; renderBacklog();
  try{
    const r = await fetch('/api/backlog', {method:'POST', headers:{'Content-Type':'application/json'},
      // `expect` is the count the banner showed. The server re-resolves the ids itself and
      // refuses on a mismatch, so a board left open while the hourly search ran can never
      // delete a job that arrived after this page was drawn.
      body: JSON.stringify({action, expect: c.n})});
    const d = await r.json();
    if(!d.ok){
      alert(d.error || 'That did not work. Nothing was changed.');
    }
  }catch(e){
    alert('The dashboard is not responding. Nothing was changed.');
  }
  BL_BUSY = '';
  await load();            // refills JOBS and BACKLOG; the banner clears itself if the cap lifted
}

function render(){
  renderBacklog();
  const list = currentList();
  // "3 of 214 jobs" is the board's answer. In the queue the denominator is the queue, not the
  // board, and the number that matters is how many resumes are still owed.
  $('#count').textContent = QUEUE_MODE
    ? (list.length + (list.length===1 ? ' job waiting' : ' jobs waiting'))
    : (list.length + ' of ' + JOBS.length + ' jobs');
  $('#sortdir').textContent = sortDirLabel();
  renderEmpty(list);
  if(VIEW === 'table') return renderTable(list);
  renderCards(list);
}

/* ---------------- the empty board, explained ----------------
   An empty list has a reason, and the reason decides what the user should do next. A board with
   no jobs at all means no search has run — the answer is on the Schedule page, not on this one.
   A board trimmed to nothing by a search, a filter set, or a status list means the jobs ARE here
   and the answer is one click away. The old single line ("No jobs match this filter.") named a
   cause it could not know was the real one, offered nothing to press, and left the rest of the
   window blank with a preview hint pointing at an empty column.
   The status copy below is per LIST, because "nothing here" means something different in each:
   an empty Pending list is good news, an empty Bookmarked list is just an unused feature. */
const STATUS_LABEL = {active:'Pending', all:'All',
                      applied:'Applied', skipped:'Skipped', bookmarked:'Bookmarked', banned:'Banned'};
const STATUS_EMPTY = {
  active:     ['You are all caught up',
               'You applied to, skipped or banned every job on the board. No job waits for a decision.'],
  applied:    ['Nothing marked applied yet',
               'Open a job, press <b>Status</b> and pick Applied. It moves into this list.'],
  skipped:    ['Nothing skipped yet',
               'A job that you pass on comes here. It stays on the board, so you can always undo a skip.'],
  bookmarked: ['No bookmarks yet',
               'Press the star on a job to keep it in this list.'],
  banned:     ['No banned employers',
               'A ban hides every posting from that employer. Those postings collect here, and an unban returns them.'],
  all:        ['Nothing to show here',
               'Every job on the board belongs to a banned employer. The <b>Banned</b> list still has them.'],
};
// The app mark: cyborg rat, lightning-bolt tail. Body/ear are currentColor (--muted via
// .emptyart); the visor and the bolt are --amber so the accent stays inside the design system;
// the circuit trace and nose are knocked out in --surface so they read as engraving. The
// viewBox is cropped to the drawing's own bounds, which is why it starts at 26,113.
const EMPTY_ART = `<svg width="94" height="58" viewBox="26 113 460 285" aria-hidden="true">
  <g transform="translate(-61,-14) scale(1.2)">
    <path d="M22,-86 L-34,8 L2,8 L-20,86 L36,-8 L0,-8 Z" fill="var(--amber,#c07f18)"
          transform="translate(128,212) rotate(140) scale(1.3)"/>
    <circle cx="348" cy="192" r="42" fill="currentColor"/>
    <circle cx="352" cy="196" r="23" fill="var(--surface,#fbfcfd)"/>
    <path d="M452,258 C430,232 410,216 385,210 C362,204 344,206 330,212 C300,192 258,182 218,193 C174,205 146,240 146,278 C146,314 172,338 206,340 C250,344 302,334 342,316 C374,302 402,288 426,278 C441,272 449,265 452,258 Z" fill="currentColor"/>
    <path d="M196,252 L232,252 L246,266 L286,266" stroke="var(--surface,#fbfcfd)" stroke-width="9"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="194" cy="252" r="9" fill="var(--surface,#fbfcfd)"/>
    <circle cx="288" cy="266" r="9" fill="var(--surface,#fbfcfd)"/>
    <g transform="rotate(-14 406 240)"><rect x="382" y="228" width="52" height="24" rx="12" fill="var(--amber,#c07f18)"/></g>
    <circle cx="446" cy="256" r="9" fill="var(--surface,#fbfcfd)"/>
  </g>
</svg>`;
const MOTTO = 'Stay ahead of the pack, be a top rat.';
// Shared by both empty states that can start a run (see runAct), so the wording of a search in
// progress does not drift between them.
const SEARCHING_MSG = 'The search runs now. The app scrapes, scores and prices the job boards. '
                    + 'The board fills itself at the end.';

function renderEmpty(list){
  document.body.classList.toggle('is-empty', !list.length);
  const host = $('#empty');
  host.hidden = list.length > 0;
  if(list.length) return;

  const q  = $('#q').value.trim();
  const fs = $('#fstatus').value;
  const nf = FILTERS.size;
  const acts = [];
  let title, msg;

  if(QUEUE_MODE){
    // An empty queue is the GOOD state, and the board's reasons (no search has run, a filter is
    // on, the wrong status list) do not apply here — the only two causes are "nothing queued" and
    // "the search box hides what is queued".
    if(q){
      title = 'No queued job matches';
      msg = 'Nothing in the queue matches <b>“' + esc(q) + '”</b>.';
      acts.push({label:'Clear search', fn:'clearSearch()', pri:true});
    }else{
      title = 'The queue is empty';
      msg = 'Nothing is waiting for a resume. Open the board and press <b>Tailor resume</b> on a job to add it here.';
      acts.push({label:'Go to the job board', href:'/', pri:true});
    }
  }else if(!JOBS.length){
    // Nothing on the board at all: no filter can explain this, so don't offer to clear one.
    // The board is empty because no search has RUN, so the first button runs one — the two
    // config pages are a detour, and a first-run visitor has already been sent to /setup by
    // ONBOARD_JS before ever reaching this panel.
    title = 'No jobs on the board yet';
    msg = SEARCH_RUNNING ? SEARCHING_MSG
        : 'The app found nothing so far. Run a search now. You can also add a search to the '
          + 'schedule, and then it runs by itself.';
    acts.push(runAct(), {label:'Schedule searches', href:'/schedule'});
  }else{
    // The jobs are here; something trimmed them. Name every reason, offer the undo for each.
    const causes = [];
    if(q)  causes.push('the search <b>“' + esc(q) + '”</b>');
    if(nf) causes.push(nf === 1 ? '1 active filter' : nf + ' active filters');
    if(!causes.length){
      [title, msg] = STATUS_EMPTY[fs] || STATUS_EMPTY.all;
      /* "All caught up" is the one status list whose emptiness is a SUPPLY problem, not a display
         problem: every job on the board is applied, skipped or banned, so no undo below brings
         work back — "Show all jobs" only re-shows decisions already made. The remedy is new
         postings, so the run goes here too, ahead of that undo. Deliberately not offered on the
         other lists: applied/skipped/bookmarked/banned are empty because nothing has been put in
         them yet, and a scrape does not fill them. */
      if(fs === 'active'){
        if(SEARCH_RUNNING) msg = SEARCHING_MSG;
        acts.push(runAct());
      }
    }else{
      // Name the CONDITION, not the outcome. "No jobs match" reads like a verdict on the board
      // ("there is nothing for you"); the board is full and a filter set is hiding it.
      title = nf ? 'No jobs matching filter(s) set' : 'No jobs matching search';
      const where = (fs !== 'all' && STATUS_LABEL[fs]) ? ' in <b>' + STATUS_LABEL[fs] + '</b>' : '';
      msg = 'Nothing gets past ' + causes.join(' and ') + where + '. '
          + JOBS.length + (JOBS.length === 1 ? ' job is' : ' jobs are') + ' on the board.';
    }
    /* Offer an undo only if it actually undoes something. Three conditions can be on at once,
       and dropping one of them does not necessarily reveal a job: with a search that matches
       nothing anywhere, "Clear filters" would leave the board exactly as empty, and a button
       that visibly does nothing is worse than no button. So each one is tested against the real
       list first — currentList(over) re-runs the filter with that single condition lifted. */
    const shows = o => currentList(o).length > 0;
    if(q  && shows({q:''}))                acts.push({label:'Clear search', fn:'clearSearch()'});
    if(nf && shows({filters:new Set()}))   acts.push({label: nf === 1 ? 'Clear filter' : 'Clear filters',
                                                      fn:'clearFilters()'});
    if(fs !== 'all' && shows({fs:'all'}))  acts.push({label:'Show all jobs', fn:"setStatusFilter('all')"});
    // No single undo is enough, but lifting everything is: offer the one button that works.
    if(!acts.length && (q || nf || fs !== 'all') && shows({q:'', fs:'all', filters:new Set()}))
      acts.push({label:'Reset search and filters', fn:'resetBoard()'});
    // Not even that. Every job on the board belongs to a banned employer, and the Banned list is
    // the only place they still appear.
    if(!acts.length && fs !== 'banned' && JOBS.some(j=>j.blocked))
      acts.push({label:'See banned jobs', fn:"setStatusFilter('banned')"});
    if(acts.length) acts[0].pri = true;
  }

  host.innerHTML = `<div class="emptybox">
    <div class="emptyart">${EMPTY_ART}</div>
    <div class="emptytitle">${title}</div>
    <div class="emptymsg">${msg}</div>
    <div class="emptyacts">${acts.map(a=>
      `<button class="btn${a.pri?' pri':''}"${a.off?' disabled':''} onclick="${a.fn || ("location.href='"+a.href+"'")}">${a.label}</button>`
    ).join('')}</div>
    ${SEARCH_NOTE?`<div class="emptynote${SEARCH_ERR?' bad':''}">${SEARCH_NOTE}</div>`:''}
    <div class="emptymotto">${MOTTO}</div>
  </div>`;
}
function clearSearch(){ const i = $('#q'); i.value = ''; render(); i.focus(); }
function setStatusFilter(v){ $('#fstatus').value = v; render(); }
// Lift every board-level condition at once. Only offered when no single one of them is enough.
function resetBoard(){
  $('#q').value = ''; $('#fstatus').value = 'all';
  FILTERS.clear(); saveFilters(); syncFilterChips(); render();
}

/* ---------------- run a search from the empty board ----------------
   Two empty states are answered by a search, and both offer the run itself instead of a link to
   a page that only configures one: no jobs on the board at all (no search has ever RUN), and
   "You are all caught up" (jobs exist, every one of them is decided). A search/filter emptiness
   is NOT one of them — the same condition would hide whatever the run brings back.
   This is the SAME zero-token path the scheduler
   uses — POST /api/run → scheduler.run_job(name, manual=True), which shells out to
   scrape.py → jobpipe candidates. salary_probe is no longer in that chain: it is the job's
   `after_steps` tail, which starts once the task is reported done and holds nothing up (see
   watchSearch). No Claude anywhere in it, per the CLAUDE.md "everything works without Claude" rule.
   Widest net first: the 7-day sweep, falling back to the daily and hourly jobs if a customized
   schedule dropped it. run_job returns as soon as the worker thread starts, so the state lives
   in SEARCH_RUNNING/SEARCH_NOTE (module-level, NOT on the button — renderEmpty rebuilds its
   innerHTML on every render, so a typed keystroke elsewhere would otherwise wipe "Searching…"). */
const RUN_JOBS = ['weekly_sweep','daily_scrape','radar'];
let SEARCH_RUNNING = false, SEARCH_NOTE = '', SEARCH_ERR = false;
function searchNote(t, bad){ SEARCH_NOTE = t||''; SEARCH_ERR = !!bad; render(); }

// The button, in one place, for both callers. A function declaration (hoisted) and not a const,
// because renderEmpty is defined ABOVE this section and calls it.
function runAct(){
  return {label: SEARCH_RUNNING ? 'Searching…' : '▶ Run a search now',
          fn:'runSearchNow()', pri:true, off:SEARCH_RUNNING};
}

async function runSearchNow(){
  if(SEARCH_RUNNING) return;
  // Asking for a search is the moment "why is nothing arriving?" is being asked, so a bubble
  // put down earlier in this visit comes back before the run starts.
  backlogRemind();
  SEARCH_RUNNING = true; searchNote('');
  let err = '';
  for(const job of RUN_JOBS){
    try{
      const r = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({job})});
      const d = await r.json();
      if(d.ok) return watchSearch();
      err = d.error || 'the run did not start';
      // Only a MISSING task is worth trying the next name for. "Already running" and a dead
      // scheduler apply to every task equally, so stop and say so. Both spellings are accepted
      // so an older scheduler.py ("unknown job") still falls through to the next name.
      if(!/unknown (scheduled )?(job|task)/i.test(err)) break;
    }catch(e){ err = 'the dashboard is not responding'; break; }
  }
  SEARCH_RUNNING = false;
  searchNote('The search did not start: ' + esc(err)
    + '. <a href="/schedule">Open Scheduled tasks</a> to run it there, or '
    + '<a href="/setup">check your search settings</a>.', true);
}

/* Poll until the JOBS ARRIVE — not until the scheduled task ends. /api/sched-status is the
   status-only endpoint the nav pill uses, so this still adds no new server work.

   The two are not the same moment, and the gap used to be minutes. A search task ends with work
   that ENRICHES postings already on the board (pricing them), so waiting for the task meant
   holding "Searching…" long after the board could have been drawn. `backlog.count` is the
   pending-job count from the SAME payload — backlog._pending() counts tracking.csv + candidates.csv,
   the exact two files /api/jobs merges — so a rise in it means rows the board can render are on
   disk NOW. First reading is the baseline (the board as the run found it) and any rise ends the
   wait; the old "task finished" test stays as the fallback that catches a run which adds nothing.

   Prices land later, on their own. They arrive by the next refresh, and a job with a blank pay
   chip is worth incomparably more on screen than an accurate one four minutes from now. */
function watchSearch(){
  let seen = false, tries = 0, base = null;
  const tick = async ()=>{
    tries++;
    let running = null, ok = true, count = null;
    try{
      const s = await (await fetch('/api/sched-status')).json();
      running = s.runningJob || null;
      if(s.backlog && typeof s.backlog.count === 'number') count = s.backlog.count;
    }
    catch(e){ ok = false; }
    if(running) seen = true;
    // Set on the first reading that arrives, so a failed first poll costs the arrival test but
    // never mis-sets the baseline to a post-arrival count (which would hide the rise entirely).
    if(ok && count !== null && base === null) base = count;
    const arrived = ok && count !== null && base !== null && count > base;
    // ~5 minutes of polling, then stop guessing and let the user reload.
    if(arrived || (ok && seen && !running) || tries > 100){
      SEARCH_RUNNING = false;
      await load();                       // JOBS is refilled; if any arrived, the panel is gone
      /* Test the LIST, not JOBS. On a caught-up board JOBS is never empty (every job is decided),
         so a JOBS test would report success while the panel still says "all caught up" — the
         button would look like it did nothing. currentList() is what the user is looking at, and
         the run is only offered when no search or filter narrows it. */
      if(!currentList().length) searchNote('The search is complete and it found nothing. Your search terms '
        + 'can be too narrow, or the boards have nothing new. '
        + '<a href="/setup">Check your search settings</a>.', false);
      // Said out loud only when the board was drawn while the task was still going, because that
      // is the only case where a blank pay chip means "not yet" rather than "not found".
      else if(arrived && running) toast('Jobs are in. Pay is still loading.');
      return;
    }
    setTimeout(tick, 3000);
  };
  render();               // paint the "Searching…" state before the first poll
  setTimeout(tick, 1200);
}

function renderCards(list){
